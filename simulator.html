<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カタノリロボ シミュレーター</title>
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c1017;
      color: #e2e8f0;
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    #root {
      max-width: 1280px;
      margin: 0 auto;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #2a3547;
      margin-bottom: 20px;
    }
    .app-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1px;
    }
    .badge-sub {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 960px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    .panel {
      background: #161c24;
      border: 1px solid #2a3547;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222c3a;
      padding-bottom: 8px;
    }
    .panel-title-clean {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .robot-body {
      background: radial-gradient(circle at center, #242e3e 0%, #161c24 100%);
      border: 2px solid #3b485d;
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.05), 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .robot-head-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 2px;
    }
    .oled-container {
      background: #000;
      border: 4px solid #0f172a;
      outline: 2px solid #2563eb;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }
    .oled-screen {
      display: block;
      background: #06090e;
      border-radius: 4px;
      image-rendering: pixelated;
    }
    .speaker-section {
      width: 100%;
      max-width: 340px;
      background: #0f141c;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #252e3e;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .speaker-label {
      font-size: 11px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .speaker-grill {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
      width: 100%;
      padding: 6px 12px;
    }
    .speaker-hole {
      width: 6px;
      height: 6px;
      background: #070a0f;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      margin: 0 auto;
    }
    .speaker-hole.vibrating {
      animation: pulse-hole 0.3s infinite alternate;
    }
    @keyframes pulse-hole {
      0% { background: #070a0f; }
      100% { background: #00f0ff; box-shadow: 0 0 4px #00f0ff; }
    }
    .speech-bubble {
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      font-size: 14px;
      color: #38bdf8;
      min-height: 48px;
      display: flex;
      align-items: center;
      position: relative;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 8px 8px 8px;
      border-style: solid;
      border-color: transparent transparent #3b82f6 transparent;
    }
    .control-sections {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hw-status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .hw-card {
      background: #0f141c;
      border: 1px solid #222d3d;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hw-card-title {
      font-size: 11px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .hw-card-val {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
    }
    .dot-led.green { background: #00e676; box-shadow: 0 0 6px #00e676; }
    .dot-led.cyan { background: #00f0ff; box-shadow: 0 0 6px #00f0ff; }
    .dot-led.yellow { background: #ffea00; box-shadow: 0 0 6px #ffea00; }

    .control-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .btn:hover:not(:disabled) {
      background: #334155;
      border-color: #475569;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-power {
      background: #991b1b;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-power.active {
      background: #166534;
      border-color: #22c55e;
    }
    .btn-wakeword {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
    }
    .btn-wakeword:hover:not(:disabled) {
      background: #0369a1;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      flex: 1;
    }
    .text-input {
      flex: 1;
      background: #0f141c;
      border: 1px solid #2a3547;
      border-radius: 6px;
      padding: 10px 14px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input:focus {
      border-color: #00f0ff;
    }
    .text-input:disabled {
      opacity: 0.4;
    }
    .setting-group {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #0f141c;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #222d3d;
    }
    .setting-group-mb {
      margin-bottom: 16px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .flex-1 {
      flex: 1;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #334155;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch.on {
      background: #2563eb;
    }
    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch.on .toggle-knob {
      transform: translateX(20px);
    }
    .slider-input {
      accent-color: #00f0ff;
      cursor: pointer;
    }
    .serial-panel {
      display: flex;
      flex-direction: column;
      height: 260px;
    }
    .serial-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .serial-logs {
      flex: 1;
      background: #070a0f;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .log-line {
      display: flex;
      gap: 8px;
      word-break: break-all;
    }
    .log-time {
      color: #475569;
      user-select: none;
    }
    .log-tag {
      font-weight: bold;
      padding: 0 4px;
      border-radius: 2px;
      user-select: none;
    }
    .log-tag-BOOT { color: #38bdf8; }
    .log-tag-I2C { color: #facc15; }
    .log-tag-DSP { color: #c084fc; }
    .log-tag-STATE { color: #4ade80; }
    .log-tag-TTS { color: #fb7185; }
    .log-tag-SYS { color: #94a3b8; }
    .log-tag-ERR { color: #f87171; }
    .log-msg {
      color: #cbd5e1;
    }
    .label-checkbox {
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .log-empty {
      color: #475569;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // (RULESモックは削除し、WebSocket経由でGemini APIと通信します)

    function App() {
      // 状態管理
      const [power, setPower] = useState(true);
      const [robotState, setRobotState] = useState('idle'); // idle | listening | thinking | speaking
      const [ttsEnabled, setTtsEnabled] = useState(true);
      const [volume, setVolume] = useState(80);
      const [inputText, setInputText] = useState('');
      const [speechText, setSpeechText] = useState('待機中...');
      const [logs, setLogs] = useState([]);
      const [autoScroll, setAutoScroll] = useState(true);

      const canvasRef = useRef(null);
      const logContainerRef = useRef(null);
      const animationFrameRef = useRef(null);
      const stateTimerRef = useRef(null);
      const wsRef = useRef(null);
      
      // 最新のStateをイベントリスナーから参照するためのRef
      const stateRef = useRef({ ttsEnabled, volume });
      useEffect(() => {
        stateRef.current = { ttsEnabled, volume };
      }, [ttsEnabled, volume]);

      // ログ追加関数
      const addLog = useCallback((tag, message) => {
        const timeStr = new Date().toISOString().split('T')[1].slice(0, 12);
        setLogs(prev => {
          const next = [...prev, { id: Date.now() + Math.random(), time: timeStr, tag, message }];
          return next.slice(-200);
        });
      }, []);

      // シリアルログ自動スクロール
      useEffect(() => {
        if (autoScroll && logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs, autoScroll]);

      // 電源ON/OFF制御
      useEffect(() => {
        if (power) {
          addLog('BOOT', '========================================');
          addLog('BOOT', 'Katanori Robot Firmware v1.0.4-esp32s3');
          addLog('BOOT', 'MCU: ESP32-S3 (240MHz Dual Core, 8MB PSRAM)');
          addLog('I2C', 'Scanning I2C Bus 0 (SDA: GPIO4, SCL: GPIO5)...');
          addLog('I2C', 'Device found at 0x3C (SSD1306 OLED Display 128x64)');
          addLog('DSP', 'ReSpeaker Lite (XMOS XU316) handshake success.');
          addLog('DSP', 'Acoustic Echo Cancellation (AEC) enabled.');
          addLog('STATE', 'State transition: POWER_OFF -> IDLE');
          addLog('BOOT', 'System ready. Connecting to DO Mock Server...');
          setRobotState('idle');
          setSpeechText('待機中...');

          // WebSocket 接続
          const ws = new WebSocket('ws://localhost:8080');
          wsRef.current = ws;
          ws.onopen = () => addLog('SYS', 'WebSocket Connected.');
          ws.onmessage = (event) => {
             try {
               const data = JSON.parse(event.data);
               if (data.type === 'sys') addLog('SYS', data.message);
               if (data.type === 'text') {
                  const reply = data.text;
                  addLog('STATE', 'State transition: THINKING -> SPEAKING');
                  addLog('TTS', `Synthesizing Speech output: "${reply}"`);
                  setRobotState('speaking');
                  setSpeechText(reply);
                  
                  const { ttsEnabled, volume } = stateRef.current;
                  if (ttsEnabled && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(reply);
                    utterance.lang = 'ja-JP';
                    utterance.volume = volume / 100;
                    utterance.onend = () => {
                      addLog('STATE', 'State transition: SPEAKING -> IDLE');
                      setRobotState('idle');
                      setSpeechText('待機中...');
                    };
                    window.speechSynthesis.speak(utterance);
                  } else {
                    stateTimerRef.current = setTimeout(() => {
                      addLog('STATE', 'State transition: SPEAKING -> IDLE');
                      setRobotState('idle');
                      setSpeechText('待機中...');
                    }, 3000);
                  }
               }
               if (data.type === 'error') {
                  addLog('ERR', data.text);
                  setRobotState('idle');
                  setSpeechText('エラー発生');
               }
             } catch(e) {}
          };
          ws.onerror = () => addLog('ERR', 'WebSocket Error.');
          ws.onclose = () => addLog('SYS', 'WebSocket Disconnected.');

        } else {
          addLog('SYS', 'Power switch turned OFF. System shutting down.');
          setRobotState('idle');
          setSpeechText('電源OFF');
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          if (stateTimerRef.current) clearTimeout(stateTimerRef.current);
          if (wsRef.current) wsRef.current.close();
        }
      }, [power, addLog]);

      // OLED Canvas アニメーション描画
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameCount = 0;
        let blinkCounter = 0;
        let isBlinking = false;

        const drawOLED = () => {
          frameCount++;
          // 背景クリア
          ctx.fillStyle = '#06090e';
          ctx.fillRect(0, 0, 512, 256);

          if (!power) {
            animationFrameRef.current = requestAnimationFrame(drawOLED);
            return;
          }

          // 描画ヘルパー
          const drawPixel = (px, py, color = '#00f0ff') => {
            ctx.fillStyle = color;
            ctx.fillRect(px * 4, py * 4, 4, 4);
          };

          const drawRectPixels = (x, y, w, h, color = '#00f0ff') => {
            ctx.fillStyle = color;
            ctx.fillRect(x * 4, y * 4, w * 4, h * 4);
          };

          // ヘッダー状態表示
          ctx.fillStyle = '#00f0ff';
          ctx.font = '16px "JetBrains Mono", monospace';
          ctx.fillText(`STATUS: [${robotState.toUpperCase()}]`, 8, 20);

          if (robotState === 'idle') {
            // まばたきアニメーション
            blinkCounter++;
            if (blinkCounter > 140) {
              isBlinking = true;
              if (blinkCounter > 152) {
                blinkCounter = 0;
                isBlinking = false;
              }
            }

            const eyeHeight = isBlinking ? 2 : 24;
            const eyeY = isBlinking ? 34 : 22;
            drawRectPixels(24, eyeY, 28, eyeHeight);
            drawRectPixels(76, eyeY, 28, eyeHeight);

            // にっこり口
            drawRectPixels(48, 52, 32, 4);
            drawPixel(44, 50);
            drawPixel(80, 50);

          } else if (robotState === 'listening') {
            // マイクアイコン
            drawRectPixels(58, 14, 12, 18);
            drawRectPixels(54, 26, 20, 4);
            drawRectPixels(62, 30, 4, 10);

            // サイン波アニメーション
            for (let x = 8; x < 120; x++) {
              const waveY = Math.round(50 + Math.sin((x + frameCount * 4) * 0.15) * 8);
              drawPixel(x, waveY, '#00f0ff');
            }

          } else if (robotState === 'thinking') {
            // THINKING ドットアニメーション
            ctx.fillStyle = '#00f0ff';
            ctx.font = '20px "Chakra Petch", sans-serif';
            ctx.fillText('THINKING...', 160, 110);

            const dotStep = Math.floor((frameCount / 15) % 4);
            for (let i = 0; i < 3; i++) {
              const active = i < dotStep;
              const radius = active ? 8 : 4;
              ctx.beginPath();
              ctx.arc(200 + i * 40, 160, radius, 0, Math.PI * 2);
              ctx.fillStyle = active ? '#00f0ff' : '#1e293b';
              ctx.fill();
            }

          } else if (robotState === 'speaking') {
            // 目
            drawRectPixels(28, 20, 24, 16);
            drawRectPixels(76, 20, 24, 16);

            // 口パク
            const mouthOpen = Math.floor((frameCount / 6) % 3);
            const mouthH = 4 + mouthOpen * 8;
            drawRectPixels(48, 44 - mouthOpen * 2, 32, mouthH);

            // テキスト横スクロール
            ctx.fillStyle = '#00f0ff';
            ctx.font = '16px "Noto Sans JP", sans-serif';
            const textWidth = ctx.measureText(speechText).width;
            const scrollX = 512 - ((frameCount * 3) % (textWidth + 512));
            ctx.fillText(speechText, scrollX, 240);
          }

          // 画面グリッド線
          ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
          for (let y = 0; y < 256; y += 4) {
            ctx.fillRect(0, y, 512, 1);
          }

          animationFrameRef.current = requestAnimationFrame(drawOLED);
        };

        drawOLED();

        return () => {
          if (animationFrameRef.current) {
            cancelAnimationFrame(animationFrameRef.current);
          }
        };
      }, [power, robotState, speechText]);

      // 発話メッセージ処理
      const handleUserMessage = (msgText) => {
        if (!power || !msgText.trim()) return;

        addLog('STATE', `State transition: ${robotState.toUpperCase()} -> THINKING`);
        addLog('DSP', `Input Audio Stream received: "${msgText}"`);
        setRobotState('thinking');
        setSpeechText('考え中...');
        setInputText('');

        // つなぎ言葉のローカル再生（UXのラグ隠蔽）
        const fillers = ["うんうん", "えーっと", "ちょっと待ってね"];
        const filler = fillers[Math.floor(Math.random() * fillers.length)];
        if (ttsEnabled && 'speechSynthesis' in window) {
           const utterance = new SpeechSynthesisUtterance(filler);
           utterance.lang = 'ja-JP';
           utterance.volume = volume / 100;
           window.speechSynthesis.speak(utterance);
        }

        // WebSocketサーバーへ送信
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
           wsRef.current.send(JSON.stringify({ type: 'text', text: msgText }));
        } else {
           addLog('ERR', 'WebSocket is not connected.');
           setRobotState('idle');
           setSpeechText('通信エラー');
        }
      };

      // ウェイクワード
      const triggerWakeWord = () => {
        if (!power) return;
        addLog('STATE', `State transition: ${robotState.toUpperCase()} -> LISTENING`);
        addLog('DSP', 'Wake-Word "カタノリ" detected by XMOS DSP!');
        setRobotState('listening');
        setSpeechText('聴き取り中...');
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        handleUserMessage(inputText);
      };

      return (
        <div>
          {/* ヘッダー */}
          <header className="app-header">
            <div className="app-title-group">
              <h1 className="app-title">KATANORI-ROBOT SIMULATOR</h1>
              <span className="badge-sub">XIAO ESP32S3 + ReSpeaker Lite</span>
            </div>
            <div className="setting-item">
              <button
                className={`btn btn-power ${power ? 'active' : ''}`}
                onClick={() => setPower(!power)}
              >
                <span>🔌</span>
                <span>{power ? 'POWER: ON' : 'POWER: OFF'}</span>
              </button>
            </div>
          </header>

          {/* メインレイアウト */}
          <div className="main-grid">
            {/* 左列: ロボット画面 */}
            <div className="panel">
              <div className="panel-title">
                <span>🤖 ROBOT FRONT HARDWARE VIEW</span>
                <span className="badge-sub">SSD1306 0.96" OLED</span>
              </div>
              <div className="robot-body">
                <div className="robot-head-label">SYSTEM FRONT FACIAL MODULE</div>
                
                <div className="oled-container">
                  <canvas
                    ref={canvasRef}
                    width={512}
                    height={256}
                    className="oled-screen"
                  />
                </div>

                <div className="speech-bubble">
                  {speechText}
                </div>

                <div className="speaker-section">
                  <div className="speaker-label">
                    8Ω 2W PASSIVE SPEAKER (PCM)
                  </div>
                  <div className="speaker-grill">
                    {Array.from({ length: 24 }).map((_, i) => (
                      <div
                        key={i}
                        className={`speaker-hole ${robotState === 'speaking' ? 'vibrating' : ''}`}
                      />
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* 右列: パネル・ログ */}
            <div className="control-sections">
              <div className="panel">
                <div className="panel-title">
                  <span>⚡ HARDWARE TELEMETRY</span>
                </div>
                <div className="hw-status-grid">
                  <div className="hw-card">
                    <span className="hw-card-title">MAIN MCU</span>
                    <span className="hw-card-val">
                      <span className={`dot-led ${power ? 'green' : ''}`}></span>
                      ESP32-S3
                    </span>
                  </div>
                  <div className="hw-card">
                    <span className="hw-card-title">AUDIO DSP</span>
                    <span className="hw-card-val">
                      <span className={`dot-led ${power ? 'cyan' : ''}`}></span>
                      XMOS XU316
                    </span>
                  </div>
                  <div className="hw-card">
                    <span className="hw-card-title">I2C DISPLAY</span>
                    <span className="hw-card-val">
                      <span className={`dot-led ${power ? 'green' : ''}`}></span>
                      0x3C DETECTED
                    </span>
                  </div>
                  <div className="hw-card">
                    <span className="hw-card-title">AEC DSP STATUS</span>
                    <span className="hw-card-val">
                      <span className={`dot-led ${power ? 'yellow' : ''}`}></span>
                      {power ? 'ACTIVE (AEC)' : 'OFF'}
                    </span>
                  </div>
                </div>

                <div className="setting-group setting-group-mb">
                  <div className="setting-item">
                    <span>🔊 Web Speech TTS:</span>
                    <div
                      className={`toggle-switch ${ttsEnabled ? 'on' : ''}`}
                      onClick={() => power && setTtsEnabled(!ttsEnabled)}
                    >
                      <div className="toggle-knob" />
                    </div>
                  </div>
                  <div className="setting-item flex-1">
                    <span>音量 ({volume}%):</span>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={volume}
                      disabled={!power}
                      onChange={(e) => setVolume(Number(e.target.value))}
                      className="slider-input flex-1"
                    />
                  </div>
                </div>

                <div className="control-row">
                  <button
                    className="btn btn-wakeword"
                    onClick={triggerWakeWord}
                    disabled={!power || robotState !== 'idle'}
                  >
                    🎙️ 「カタノリ」 (ウェイクワード)
                  </button>
                </div>

                <form onSubmit={handleSubmit} className="input-group">
                  <input
                    type="text"
                    className="text-input"
                    placeholder={power ? (robotState === 'listening' ? "メッセージを入力してEnter..." : "ウェイクワード押下または直接入力...") : "電源OFF中..."}
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    disabled={!power || robotState === 'thinking'}
                  />
                  <button
                    type="submit"
                    className="btn"
                    disabled={!power || !inputText.trim() || robotState === 'thinking'}
                  >
                    送信
                  </button>
                </form>
              </div>

              <div className="panel serial-panel">
                <div className="serial-header">
                  <div className="panel-title-clean">
                    <span>💻 SERIAL MONITOR (UART0 / 115200 baud)</span>
                  </div>
                  <div className="setting-item">
                    <label className="label-checkbox">
                      <input
                        type="checkbox"
                        checked={autoScroll}
                        onChange={(e) => setAutoScroll(e.target.checked)}
                      /> 自動スクロール
                    </label>
                    <button
                      className="btn btn-sm"
                      onClick={() => setLogs([])}
                    >
                      クリア
                    </button>
                  </div>
                </div>
                <div className="serial-logs" ref={logContainerRef}>
                  {logs.length === 0 && (
                    <div className="log-empty">シリアルログはありません...</div>
                  )}
                  {logs.map((log) => (
                    <div key={log.id} className="log-line">
                      <span className="log-time">[{log.time}]</span>
                      <span className={`log-tag log-tag-${log.tag}`}>[{log.tag}]</span>
                      <span className="log-msg">{log.message}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
