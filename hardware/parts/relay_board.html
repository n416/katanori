      if (w.jid) li.onclick = () => { sel = { kind:'jumper', id:w.jid, vi:null }; render(); };
      ul.appendChild(li);
    }
  }
  const c = document.getElementById('count');
  c.innerHTML = errs.length || warns.length
    ? `赤 <b class="bad">${errs.length}</b> ／ 黄 <b>${warns.length}</b>　—　赤がゼロになれば組める`
    : '赤 <b class="good">0</b> ／ 黄 <b class="good">0</b>　—　組める状態';
}

function drawSteps(){
  const hdr = L.HEADERS.map(h => `${h.label.split('（')[0]}（${h.pins[0].hole}〜${h.pins[h.pins.length-1].hole}）`).join(' ／ ');
  /* 🔴 文はレイアウトから作る（2026-08-14）。固定文にしていたせいで、ダイオードを
     リレーのコイルから外して I4–I6 へ移したあとも「コイルの2本にまたがせる」と
     言い続けていた。部品を動かしたら指示も動かないと、古い指示のまま組んでしまう */
  const dio = L.PARTS.find(p => p.kind === 'diode');
  const dioStep = !dio ? null : (() => {
    const isA = dio.cath === 'a';
    const ca = isA ? dio.a : dio.b, an = isA ? dio.b : dio.a;
    const caNet = NETS[dio.nets[isA ? 'a' : 'b']];
    return `<b>【${dio.under?'裏':'表'}】${dio.name}</b> を <code>${an}</code>–<code>${ca}</code> に`
      + `${dio.under ? 'またがせる' : '挿す'}。`
      + `<b>帯（カソード）は <code>${ca}</code> 側${caNet ? '＝'+caNet.label : ''}</b>。`
      + `⚠ 帯を逆にすると、トランジスタが ON の間ずっとダイオードが導通して +5V を GND へ落とす。`;
  })();
  const STEPS = [
    (() => {
      const q = L.PARTS.find(p => p.kind === 'tr');
      const f = q ? trFlat(q) : null;
      return `<b>【表】抵抗・コンデンサ・トランジスタ</b>を挿す。`
        + (q ? `🔴 ${q.name} は<b>平らな印字面を ${f.name}</b> に向ける`
             + `（B=${q.pins.B} / C=${q.pins.C} / E=${q.pins.E}）。`
             + `⚠ 逆向きだと E と B が入れ替わり、<b>鳴らないのに熱くもならない</b>。` : '');
    })(),
    dio && !dio.under ? dioStep : null,
    `<b>【裏】駆動側のブリッジ</b>を張る（図の太い短線）。`,
    `<b>【表】リレー</b>を挿す。近い2本の対（コイル—NO/NC）が手前。`,
    dio && dio.under ? dioStep : null,
    `<b>【表】PH コネクタ IN / OUT</b> を挿す。⬜ トップ型かサイド型かは現物合わせ。`,
    `<b>【表】ピンヘッダ</b>: ${hdr}。`,
    `<b>【表】ジャンパ（被覆線）</b>を図のとおり張り、端を裏でブリッジに落とす。`,
    `<b>【表】会話ボタン</b>を縦置きで挿す。<b>レバーの根本側が上</b>。NC は空き。`,
    `通電。<b>何も起きないのが正常</b>（D3 は浮いていて 10kΩ が LOW に保つ）。`,
    `シリアルで <code>high 3</code> → カチッ、<code>hiz 3</code> → 戻る。`
      + `テスターで COM–NO が OL ⇔ 0Ω を追従するか。`,
    `接点検証が通ってから、はじめてスピーカー線を IN/OUT に挿す。⚠ 挿す前に必ず声をかける。`,
  ].filter(Boolean);        /* レールも裏の部品も無いレイアウトでは、その行ごと出さない */
  /* ⚠ 手順の数や並びが変わったら版を上げること。上げないと前のチェックが別の行に付く */
  const KEY = 'hub_board_steps_v3';
  let saved = [];
  try { saved = JSON.parse(lsGet(KEY) || '[]'); } catch(e){ saved = []; }
  const ol = document.getElementById('steps');
  ol.innerHTML = '';
  STEPS.forEach((s,i) => {
    const li = document.createElement('li');
    li.innerHTML = `<input type="checkbox" ${saved[i]?'checked':''}><span class="txt">${s}</span>`;
    if (saved[i]) li.classList.add('done');
    li.querySelector('input').onchange = e => {
      li.classList.toggle('done', e.target.checked);
      let st = []; try { st = JSON.parse(lsGet(KEY) || '[]'); } catch(err){ st = []; }
      st[i] = e.target.checked;
      lsSet(KEY, JSON.stringify(st));
    };
    ol.appendChild(li);
  });
}

/* ===========================================================
   エクスポート
   =========================================================== */
function exportText(){
  const q = s => `'${s}'`;
  const arr = a => '[' + a.map(q).join(',') + ']';
  const lines = [];
  lines.push('/* ハブ基板 レイアウト（relay_board.html からエクスポート） */');
  const errs = WARN.filter(w=>w.sev==='err').length, wns = WARN.filter(w=>w.sev==='warn').length;
  lines.push(`/* 物理検査: 赤 ${errs} ／ 黄 ${wns} */`);
  if (errs) for (const w of WARN.filter(x=>x.sev==='err'))
    lines.push('/*   赤: ' + w.msg.replace(/<[^>]+>/g,'') + ' */');
  lines.push('');
  lines.push('PARTS = [');
  for (const p of L.PARTS) lines.push('  ' + (p.kind==='tr'
    ? `{ id:'${p.id}', name:'${p.name}', pins:{ ${Object.keys(p.pins).map(k=>`${k}:'${p.pins[k]}'`).join(', ')} } },`
    : `{ id:'${p.id}', name:'${p.name}', a:'${p.a}', b:'${p.b}'${p.cath?`, cath:'${p.cath}'`:''}${p.under?', under:true':''} },`));
  lines.push('];');
  lines.push(`RELAY.pins = [ ${L.RELAY.pins.map(p=>`${p.fn}:'${p.hole}'`).join(', ')} ];`);
  lines.push(`BUTTON.pins = [ ${L.BUTTON.pins.map(p=>`${p.fn}:'${p.hole}'`).join(', ')} ];`);
  for (const c of L.PHCONN)
    lines.push(`${c.id} = [ ${c.pins.map(p=>`${p.fn}:'${p.hole}'`).join(', ')} ];`);
  for (const h of L.HEADERS)
    lines.push(`${h.id} = [ ${h.pins.map(p=>`${p.fn}:'${p.hole}'`).join(', ')} ];`);
  lines.push('JUMPERS = [');
  for (const j of L.JUMPERS)
    lines.push(`  { id:'${j.id}', path:${arr(j.path)}, net:'${j.net}'${j.what?`, what:'${j.what}'`:''} },`);
  lines.push('];');
  lines.push('BRIDGES = [');
  for (const b of L.BRIDGES) lines.push(`  { path:${arr(b.path)}, net:'${b.net}' },`);
  lines.push('];');
  return lines.join('\n');
}

document.getElementById('export').onclick = () => {
  const box = document.getElementById('expbox');
  box.classList.toggle('open');
  if (box.classList.contains('open')){
    document.getElementById('exp').value = exportText();
    box.scrollIntoView({ behavior:'smooth', block:'start' });
  }
};
document.getElementById('copy').onclick = async () => {
  const ta = document.getElementById('exp');
  ta.select();
  try { await navigator.clipboard.writeText(ta.value); }
  catch(e){ document.execCommand('copy'); }
  const b = document.getElementById('copy');
  b.textContent = 'コピーしました'; setTimeout(()=>b.textContent='クリップボードにコピー', 1400);
};
document.getElementById('dl').onclick = () => {
  const blob = new Blob([exportText()], { type:'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hub_board_layout.txt';
  a.click();
};
document.getElementById('rot').onclick  = () => { rotateSelectedBlock(); check(); save(); render(); };
document.getElementById('pside').onclick = () => { rotSession=null; flipPartSide(); check(); save(); render(); };
document.getElementById('conv').onclick = () => { rotSession=null; convertSelection(); check(); save(); render(); };
document.getElementById('del').onclick  = () => { rotSession=null; deleteSelection(); check(); save(); render(); };
document.getElementById('netsel').onchange = e => {
  const o = selPath(); if (!o) return;
  pushUndo(); o.net = e.target.value; check(); save(); render();
};
document.getElementById('mute').onclick = () => {
  muteWarn = !muteWarn;
  lsSet('hub_board_mutewarn', muteWarn ? '1' : '0');
  render();
};
document.getElementById('drawmode').onclick = e => {
  drawing = !drawing;
  e.target.classList.toggle('on', drawing);
  e.target.textContent = drawing ? '線を引く（ON・空き地からドラッグ）' : '線を引く';
  render();
};
function drawSelBar(){
  const o = selPath(), any = o;
  const lab = document.getElementById('selLabel');
  const ns = document.getElementById('netsel');
  /* ⚠ 半田面では番号クリックで選べる（2026-08-18）。選択があっても、
     編集にあたるボタンは押させない。左右が反転していて操作を誤るため */
  document.getElementById('conv').disabled = !o || mirrored;
  document.getElementById('del').disabled  = !any || mirrored;
  document.getElementById('rot').disabled  = !(sel && sel.kind === 'block') || mirrored;
  const part = selectedPart();
  document.getElementById('pside').disabled = !part || mirrored;
  ns.disabled = !any || mirrored;
  if (!any){
    if (part)
      lab.innerHTML = `<b>${part.name}</b>　いま <b>${part.under?'半田面（裏）':'部品面（表）'}</b>　ドラッグで移動`;
    else
      lab.textContent = sel && sel.kind==='block' ? '部品を選択中（ドラッグで移動）' : '選択なし';
    ns.innerHTML = '';
    return;
  }
  const where = sel.vi===null||sel.vi===undefined ? '（ぜんぶ）' : '（点 '+(sel.vi+1)+' を編集中）';
  const runs = sel.kind==='bridge' ? railRuns(o.path, insertions()) : [];
  const bus = runs.length
    ? '（レール ' + runs.map(r => r[0]+'〜'+r[r.length-1]).join('・') + '）' : '';
  lab.innerHTML = `${sel.kind==='jumper' ? '表の被覆線 <b>'+sel.id+'</b>' : '裏のブリッジ <b>#'+sel.id+'</b>'+bus}`
    + `　${o.path[0]} → ${o.path[o.path.length-1]}　${where}`;
  ns.innerHTML = Object.keys(NETS).map(k =>
    `<option value="${k}" ${k===any.net?'selected':''}>${NETS[k].label}</option>`).join('');
}

document.getElementById('undo').onclick = () => {
  rotSession = null;
  if (undoStack.length){ L = undoStack.pop(); sel = null; check(); save(); render(); }
};
document.getElementById('reset').onclick = () => {
  rotSession = null;
  pushUndo(); L = initialLayout(); sel = null; check(); save(); render();
};
document.getElementById('flip').onclick = e => {
  mirrored = !mirrored;
  /* 🔴 2026-08-18: 選択は残す。表で光らせた線を裏返して同じ物を追うため。
     点の編集だけは打ち切る（裏では編集できないので、ハンドルが残ると嘘になる） */
  if (sel) sel.vi = null;
  e.target.classList.toggle('on', mirrored);
  e.target.textContent = mirrored ? '部品面に戻す' : '半田面に裏返す';
  document.getElementById('sideLabel').innerHTML = mirrored
    ? 'いま見ているのは <b>半田面</b>（左右が反転・編集はできません）'
    : 'いま見ているのは <b>部品面</b>（編集できます）';
  render();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

function render(){
  draw(); drawNums(); drawNets(); drawWarns(); drawSelBar();
  if (!drag) drawSteps();     /* 手順は向きや穴を読んで作るので、編集のたびに作り直す */
  document.getElementById('undo').disabled = !undoStack.length;
  document.getElementById('mute').textContent = muteWarn ? '警告を出す' : '警告を隠す';
  if (document.getElementById('expbox').classList.contains('open'))
    document.getElementById('exp').value = exportText();
}

check();
render();
</script>
