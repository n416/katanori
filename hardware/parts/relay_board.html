<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハブ基板の穴割り（編集できる版）</title>
<!--
  ハブ基板（ミュートリレー駆動 + コネクタ集約）の穴割り。
  対象は 両面スルーホール C基板 DAISEN PU52X74（外形 52×74mm・穴は27列×19行・2.54mm）。
  回路と定数の根拠は docs/POWER.md。ここは図と組む順番だけ。

  ▸ 部品面では【線も部品もマウスで動かせる】。動かすたびに物理検査が走る。
  ▸ 直した結果は「エクスポート」でテキストにして渡せる。
-->
<style>
  :root{
    --bg:#f7f6f3; --fg:#22201d; --sub:#6f6a63; --line:#cfc9c0;
    --board:#e8e2d6; --hole:#8c8578; --panel:#fffefb;
    --v5:#d1453b; --gnd:#3f3f3f; --in:#b57200; --base:#2e7d32; --col:#1565c0;
    --jump:#7b4bbd; --err:#c62828; --amber:#b57200; --spk:#00695c; --sel:#0b84ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191817; --fg:#eae6df; --sub:#a09a91; --line:#3d3a35;
      --board:#2b2823; --hole:#6b655c; --panel:#211f1d;
      --v5:#ff6b5e; --gnd:#b9b4ab; --in:#e0a02a; --base:#5cc46a; --col:#5aa9f0;
      --jump:#b085f5; --err:#ff6b5e; --amber:#e0a02a; --spk:#4db6ac; --sel:#4da6ff;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    line-height:1.7;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:1.25rem;margin:0 0 4px}
  h2{font-size:.92rem;margin:0 0 10px}
  .lead{color:var(--sub);font-size:.86rem;margin:0 0 12px}
  .lead code,#exp code{background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  button{
    font:inherit;font-size:.82rem;padding:6px 13px;border-radius:7px;cursor:pointer;
    background:var(--panel);color:var(--fg);border:1px solid var(--line);
  }
  button:hover{border-color:var(--sub)}
  button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  button:disabled{opacity:.4;cursor:default}
  .side{font-size:.8rem;color:var(--sub)}
  /* 番号の並び（drawNums）。押すと図の中でその1本が光る。
     ⚠ 欠番は詰めない。詰めると「⑳が無い」ことが画面から消える */
  .nums{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 9px;align-items:center}
  .nums button{font-size:1.02rem;line-height:1;padding:5px 6px;min-width:33px;font-weight:700}
  .nums button.on{background:var(--sel);border-color:var(--sel);color:#fff!important}
  .nums .gap{min-width:33px;text-align:center;font-size:1.02rem;color:var(--line);cursor:default}
  .boardbox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
  /* 図の上でドラッグしたときに、ラベルの文字や周りの説明文が選択されないようにする */
  svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
  svg text{user-select:none;-webkit-user-select:none}
  body.dragging{user-select:none;-webkit-user-select:none;cursor:move}
  .nets{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
  .chip{
    font-size:.78rem;padding:4px 11px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.on{border-color:currentColor;font-weight:700}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px}
  #warns{margin:0;padding-left:1.3em;font-size:.8rem}
  #warns li{margin-bottom:4px}
  #warns li.err{color:var(--err)}
  #warns li.warn{color:var(--amber)}
  #warns li.ok{color:var(--base)}
  #warns li.clickable{cursor:pointer;text-decoration:underline dotted}
  #warns code{font-family:ui-monospace,Menlo,Consolas,monospace}
  #steps{margin:0;padding-left:0;list-style:none;font-size:.84rem;counter-reset:step}
  #steps li{margin-bottom:8px;display:flex;gap:9px;align-items:baseline;counter-increment:step}
  #steps li::before{content:counter(step) ".";color:var(--sub);min-width:1.4em;text-align:right}
  #steps li.done .txt{opacity:.4;text-decoration:line-through}
  #steps input{transform:translateY(2px)}
  #expbox{display:none}
  #expbox.open{display:block}
  textarea{
    width:100%;height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;
    background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:10px;
  }
  .count{font-size:.78rem;color:var(--sub)}
  .count b.bad{color:var(--err)}
  .count b.good{color:var(--base)}
  /* 🔴 2026-08-18 追加。選んだ線を光らせる（drawSpotlight）。
     ⚠ 実体に触るのは opacity だけ。太さや色を動かすと、隣の線と重なって
     どこまでが1本なのか、かえって分からなくなる */
  @keyframes glowpulse{ 0%,100%{opacity:.9} 50%{opacity:.1} }
  .glow{ animation:glowpulse 1.05s ease-in-out infinite }
  @media (prefers-reduced-motion: reduce){ .glow{animation:none;opacity:.5} }
</style>
</head>
<body>
<div class="wrap">

  <h1>ハブ基板の穴割り（編集できる版）</h1>
  <p class="lead">
    両面スルーホール C基板 DAISEN PU52X74（外形 52×74mm・27列×19行）。回路と定数の根拠は <code>docs/POWER.md</code>。
  </p>

<!-- 🔴 2026-08-18、図の下にあった長い操作説明を消した（ユーザー「こんなバカみたいな
     説明いらない」）。ここは図と組む順番だけの場所で、長文は読まれない。
     ⚠ 説明を書き足したくなったら、ここではなく docs/POWER.md か、
     その挙動を実装しているコードのコメントへ書くこと。
     操作の案内が要る所は、ボタンの文言と図の中の <title>（tip）で出す。 -->

  <div class="bar">
    <button id="flip">半田面に裏返す</button>
    <button id="undo">元に戻す (Ctrl+Z)</button>
    <button id="reset">初期状態に戻す</button>
    <button id="export">エクスポート</button>
    <button id="mute">警告を隠す</button>
    <span class="side" id="sideLabel">いま見ているのは <b>部品面</b>（編集できます）</span>
  </div>
  <div class="bar" id="selbar">
    <button id="drawmode">線を引く</button>
    <span class="side" id="selLabel">選択なし</span>
    <button id="rot">部品を回転 (R)</button>
    <button id="pside">この部品を表 ⇔ 裏</button>
    <button id="conv">表の被覆線 ⇔ 裏のブリッジ</button>
    <button id="del">この線を削除</button>
    <label class="side">ネット
      <select id="netsel"></select>
    </label>
  </div>
  <p class="count" id="count"></p>

  <!-- 🔴 2026-08-18（ユーザー「①どこだーー？？？」）。
       図の中の番号をクリックさせる作りは順番が逆だった。光らせるために、まず
       その番号を図から探す羽目になる。番号は盤の外に、いつも同じ場所に、
       抜けも見える形で並べる。ここを押すと図の中でその1本が光る。 -->
  <div class="nums" id="nums"></div>

  <div class="boardbox"><svg id="svg"></svg></div>

  <div class="nets" id="nets"></div>

  <section>
    <h2>物理検査（動かすたびに走る）</h2>
    <ul id="warns"></ul>
  </section>

  <section id="expbox">
    <h2>エクスポート — これを丸ごと渡してください</h2>
    <p class="lead" style="margin:0 0 8px">
      <button id="copy">クリップボードにコピー</button>
      <button id="dl">ファイルに保存</button>
    </p>
    <textarea id="exp" readonly></textarea>
  </section>

  <section>
    <h2>組む順番</h2>
    <ol id="steps"></ol>
  </section>

</div>

<script>
/* ===========================================================
   LAYOUT — 初期状態。編集結果はエクスポートで取り出す
   =========================================================== */
/* 🔴 実物の基板は DAISEN PU52X74（A8サイズ）。2026-08-14 にメーカー図面で確定した。
   外形 52 × 74mm・FR-4 ガラエポ・両面スルー・板厚 1.6mm・角R1・パッドφ1.0。
   穴の並ぶ範囲は 66.04 × 45.72mm で、どちらも 2.54 で割り切れる（26 と 18）ので
   長辺 27穴 × 短辺 19穴。長辺を横、短辺を縦に置く。
   取り付け穴は 4-φ3.2、中心間隔 68 × 46mm。
   ⚠ 四隅は取り付け穴に食われて縦2穴ずつ欠けている（ユーザーが実物で確認）。 */
const ROWS = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q','R','S'];
const NCOL = 27;
const NOTCH = new Set(['A1','B1','R1','S1','A27','B27','R27','S27']);

const NETS = {
  V5:   { label:'+5V',        css:'--v5'  },
  GND:  { label:'GND',        css:'--gnd' },
  IN:   { label:'D3入力',      css:'--in'  },
  BASE: { label:'ベース節点',   css:'--base'},
  COL:  { label:'コレクタ',     css:'--col' },
  V33:  { label:'3V3',        css:'--in'  },
  SCL:  { label:'SCL',        css:'--col' },
  SDA:  { label:'SDA',        css:'--base'},
  BTN:  { label:'会話ボタン (D2)', css:'--jump'},
  SPKP: { label:'スピーカー IN+ / COM', css:'--spk'},
  SPKO: { label:'スピーカー NO / OUT+', css:'--spk'},
  SPKM: { label:'スピーカー −（素通し）', css:'--spk'},
  /* 🔴 2026-08-14 追加。PowerBoost の EN。GND に落ちると昇圧が止まる＝完全停止。
     リードスイッチ・マスタートグル・0.1µF の3つが EN⇔GND に並列で入る。
     ⚠ ファームはこのネットに触らない（触ると自分の電源を切って発振する） */
  EN:   { label:'EN（電源の入切）', css:'--amber'},
  /* 新しく引いた線の既定。何のネットか決まっていないことを目に見えるようにする */
  NONE: { label:'未割り当て', css:'--sub' },
};

/* 🔴 +5V のレールは廃止した（2026-08-11 ユーザー指摘）。
   行き先はコイルと 0.1µF の2点だけで、バスにする意味が無い。
   🔒 2026-08-17、ユーザーのエクスポートをそのまま初期レイアウトにした（赤0／黄0）。
   ⚠ ここに「2026-08-14・黄11」と書いてあったのは古い。引き直しで交差も消えている。
   GND のレールもここで無くなり、レールは1本も使っていない。ここが正。 */
function initialLayout(){ return {
  /* body は実寸(mm)。nets は端子が属する節点。under=半田面に付ける */
  PARTS: [
    { id:'R1', name:'1kΩ',    kind:'res',   a:'C8',  b:'C4',
      nets:{a:'IN', b:'BASE'}, body:{L:6.2, W:2.3} },
    { id:'R2', name:'10kΩ',   kind:'res',   a:'D4',  b:'D8',
      nets:{a:'BASE', b:'GND'}, body:{L:6.2, W:2.3} },
    /* 🔴 2026-08-14: 部品面に出した。K5–K7 でリレーのコイルの足にまたがせていた頃の
       名残で under:true が貼り付いていたが、I4–I6 は空き穴なので表から普通に挿せる。
       ここを裏に戻さないこと（ユーザーが苦労して外した場所） */
    { id:'D1', name:'1N4148', kind:'diode', a:'I4',  b:'I6', cath:'a',
      nets:{a:'V5', b:'COL'}, body:{L:3.4, W:1.75} },
    { id:'C1', name:'0.1µF',  kind:'cap',   a:'F13', b:'G13',
      nets:{a:'V5', b:'GND'}, body:{L:4.5, W:2.8} },
    { id:'Q1', name:'2SC1815-GR', kind:'tr', pins:{ B:'G5', C:'G6', E:'G7' },
      nets:{B:'BASE', C:'COL', E:'GND'}, body:{L:4.6, W:3.9} },
    /* 🔴 2026-08-14 追加。リードスイッチの跳ね止め（EN⇔GND）。
       ⚠ 容量を減らすと効かない。効いているのは立ち上がり側で、
       τ＝ENのプルアップ×0.1µF がバウンス0.6msを上回っている必要がある（POWER.md） */
    { id:'C2', name:'0.1µF (EN)', kind:'cap', a:'O13', b:'N13',
      nets:{a:'EN', b:'GND'}, body:{L:4.5, W:2.8} },
  ],
  /* ⚠ COM 2本が内部で繋がっていることは、穴の名前ではなく fn:'COM' で判定している
     （solveNets）。穴で持つと動かした瞬間に取り残される */
  RELAY: { id:'RELAY', name:'リレー Y14H-1C-5DS', bodyL:12.6, bodyW:7.6,
    pins:[
      { hole:'K5', fn:'COM',    net:'SPKP' },
      { hole:'K7', fn:'COM',    net:'SPKP' },
      { hole:'N5', fn:'コイル', net:'V5'   },
      { hole:'N7', fn:'コイル', net:'COL'  },
      { hole:'O5', fn:'NO',     net:'SPKO' },
      { hole:'O7', fn:'NC',     net:null   },
    ] },
  BUTTON: { id:'BUTTON', name:'会話ボタン', bodyW:12, bodyH:5,
    pins:[
      { hole:'O23', fn:'C',  net:'GND' },
      { hole:'Q23', fn:'NO', net:'BTN' },
      { hole:'S23', fn:'NC', net:null  },
    ] },
  /* PH2.0 2P。⬜ トップ型かサイド型かは現物合わせ */
  PHCONN: [
    { id:'PHIN',  name:'IN（ReSpeakerから）', body:{L:5.9, W:4.5}, exit:'left',
      pins:[ {hole:'K1', fn:'+', net:'SPKP'}, {hole:'L1', fn:'−', net:'SPKM'} ] },
    { id:'PHOUT', name:'OUT（スピーカーへ）', body:{L:5.9, W:4.5}, exit:'left',
      pins:[ {hole:'O1', fn:'−', net:'SPKM'}, {hole:'P1', fn:'+', net:'SPKO'} ] },
  ],
  HEADERS: [
    { id:'XIAO', label:'XIAO からの7本', exit:'up',
      pins:[ {hole:'A14', fn:'5V',  net:'V5'},
             {hole:'A15', fn:'D3',  net:'IN'},
             {hole:'A16', fn:'GND', net:'GND'},
             {hole:'A17', fn:'3V3', net:'V33'},
             {hole:'A18', fn:'SCL', net:'SCL'},
             {hole:'A19', fn:'SDA', net:'SDA'},
             {hole:'A20', fn:'D2',  net:'BTN'} ] },
    /* 🔒 2026-08-17、実物が届いて並びが GND・VCC・SCL・SDA で確定した。ここと同じ順。 */
    { id:'OLED', label:'OLED 2.42" へ4本', exit:'down',
      pins:[ {hole:'E16', fn:'GND', net:'GND'},
             {hole:'E17', fn:'VDD', net:'V33'},
             {hole:'E18', fn:'SCL', net:'SCL'},
             {hole:'E19', fn:'SDA', net:'SDA'} ] },
    { id:'AS5600', label:'AS5600 へ4本（GNDは二股ケーブルでDIRへ）', exit:'right',
      pins:[ {hole:'G25', fn:'SDA', net:'SDA'},
             {hole:'H25', fn:'SCL', net:'SCL'},
             {hole:'I25', fn:'3V3', net:'V33'},
             {hole:'J25', fn:'GND', net:'GND'} ] },
    { id:'PWR', label:'PowerBoost へ4本（3本目は空き）', exit:'down',
      pins:[ {hole:'S6', fn:'EN',  net:'EN'},
             {hole:'S5', fn:'GND', net:'GND'},
             {hole:'S4', fn:'空き', net:null},
             {hole:'S3', fn:'5V',  net:'V5'} ] },
    /* 🔴 2026-08-20、TOGGLE と REED の名札を入れ替えた（ユーザー指示）。
       2つとも {GND, EN} の2ピンで同じネットに並列なので、**はんだ付けは一切変わらない**。
       入れ替える理由は筐体側で、口と相手が交差していたため:
         旧 … TOGGLE の口 X 52.97 → トグル X 40 ／ REED の口 X 45.35 → つまみ X 58.9
         新 … TOGGLE の口 X 45.35 → トグル X 40 ／ REED の口 X 52.97 → つまみ X 58.9 */
    { id:'REED', label:'リードスイッチへ2本', exit:'down',
      pins:[ {hole:'S9', fn:'GND', net:'GND'},
             {hole:'S8', fn:'EN',  net:'EN'} ] },
    { id:'INA', label:'INA226 へ4本', exit:'down',  /* ✅ 2026-09-11 実機。この並びのまま 0x44 で応答した */
      pins:[ {hole:'S16', fn:'GND', net:'GND'},
             {hole:'S17', fn:'3V3', net:'V33'},
             {hole:'S18', fn:'SCL', net:'SCL'},
             {hole:'S19', fn:'SDA', net:'SDA'} ] },
    { id:'TOGGLE', label:'マスタートグルへ2本', exit:'down',
      pins:[ {hole:'S11', fn:'GND', net:'GND'},
             {hole:'S12', fn:'EN',  net:'EN'} ] },
    /* 🔴 2026-08-17 追加。筐体の天面にも同じ会話ボタンを付けるので、その口。
       板の上のボタンと並列（どちらを押しても D2 が GND に落ちる）。
       ⚠ 出すのは GND と D2 の2本だけ。NC は板の上でも使っていない。 */
    { id:'BTN2', label:'筐体の会話ボタンへ2本', exit:'right',
      pins:[ {hole:'P26', fn:'GND', net:'GND'},
             {hole:'Q26', fn:'D2',  net:'BTN'} ] },
  ],
  /* 部品面の被覆線。直角のみ。
     🔒 2026-08-17、ユーザーのエクスポートそのまま。OLED を行E へ、AS5600 を列25 へ
     動かした引き直し版で、幹線もこれに合わせて全部引き直してある。 */
  JUMPERS: [
    { id:'①', path:['A12','A3','H3'], net:'V5', what:'5V をコイルへ（列3を下る）' },
    { id:'②', path:['B15','C15','C9'], net:'IN', what:'D3 を 1kΩ へ' },
    { id:'③', path:['I8','I9','N9','N8'], net:'COL', what:'コレクタをコイルへ' },
    { id:'⑤', path:['L17','L22','I22','I24'], net:'V33', what:'3V3 を AS5600 へ' },
    { id:'⑥', path:['I3','M3'], net:'V5', what:'5V をコイルへ（下半分）' },
    { id:'⑨', path:['G19','G22','H22','H24'], net:'SCL', what:'SCL を AS5600 へ' },
    { id:'⑩', path:['O19','P19','P18','R18'], net:'SCL', what:'SCL 幹線・下 → OLED' },
    { id:'⑪', path:['E21','E25','F25'], net:'SDA', what:'SDA を AS5600 へ' },
    { id:'⑬', path:['A21','C21','C27','Q27'], net:'BTN', what:'D2 を会話ボタンへ' },
    { id:'⑮', path:['N3','R3'], net:'V5', what:'PowerBoost の 5V を板の +5V へ' },
    { id:'⑯', path:['R12','R6'], net:'EN', what:'リードスイッチを EN の節点へ' },
    { id:'⑱', path:['L11','Q11','Q10'], net:'GND', what:'GND を下へ' },
    { id:'⑲', path:['G8','G11','J11'], net:'GND', what:'エミッタ側の GND を幹線へ' },
    { id:'㉓', path:['R5','Q5','Q9'], net:'GND', what:'（裏から表へ）' },
    { id:'④', path:['S15','N15'], net:'GND', what:'（裏から表へ）' },
    { id:'⑧', path:['M17','R17'], net:'V33', what:'（新規）' },
    { id:'⑦', path:['J15','E15'], net:'GND', what:'（裏から表へ）' },
    { id:'⑭', path:['M15','M25'], net:'GND', what:'（裏から表へ）' },
    { id:'㉑', path:['N21','S21','S20'], net:'SDA', what:'（新規）' },
    { id:'⑫', path:['F17','K17'], net:'V33', what:'（裏から表へ）' },
    { id:'⑰', path:['K25','M25','M26','O26'], net:'GND', what:'（裏から表へ）' },
  ],
  /* 半田面のブリッジ（隣り合うパッドを裏で繋ぐ）。2026-08-17 のユーザー最終版。 */
  BRIDGES: [
    { path:['E13','F13'], net:'V5' },
    { path:['H3','I3'], net:'V5' },
    { path:['I3','I4'], net:'V5' },
    { path:['M3','N3','N4','N5'], net:'V5' },
    { path:['R3','S3'], net:'V5' },
    { path:['A12','A13'], net:'V5' },
    { path:['A13','A14'], net:'V5' },
    { path:['A13','B13','C13','D13','E13'], net:'V5' },

/* ===========================================================
   状態
   =========================================================== */
/* ⚠ 初期レイアウトを書き換えたら、この番号を上げること。
   上げないと、前に開いたときの保存内容が読み込まれて新しい初期値が出ない */
const SAVE_KEY = 'hub_board_layout_v24';
let L = load() || initialLayout();
let undoStack = [];
let mirrored = false;
let activeNet = null;
let sel = null;          /* {kind:'jumper'|'bridge'|'block', id, vi:null|number} */
let drag = null;
let drawing = false;     /* 「線を引く」モード */
/* 🔴 2026-08-14: 警告の丸が盤一面に出ると線が見えなくて直せない
   （ユーザー指摘）。警告の印と一覧を黙らせる。
   ⚠ 数（赤n／黍n）は黙らせない。消すと気づかないまま組むことになる */
let muteWarn = lsGet('hub_board_mutewarn') === '1';

function clone(o){ return JSON.parse(JSON.stringify(o)); }
/* localStorage は環境によって読み書きが禁止される（data: で開いた等）ので必ず包む */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function load(){ const s = lsGet(SAVE_KEY); try { return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function save(){ lsSet(SAVE_KEY, JSON.stringify(L)); }
function pushUndo(){ undoStack.push(clone(L)); if (undoStack.length > 60) undoStack.shift(); }

/* ===========================================================
   穴の座標ヘルパ
   =========================================================== */
const PITCH = 32, PADX = 46, PADY = 46, GUTTER = 160;
const MM = PITCH / 2.54;
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';

function C(h){ return parseInt(h.slice(1),10); }
function R(h){ return ROWS.indexOf(h[0]); }
function H(c, r){ return ROWS[r] + c; }
function xOf(col){ return PADX + ((mirrored ? (NCOL + 1 - col) : col) - 1) * PITCH; }
function yOf(r){ return PADY + r * PITCH; }
function pt(h){ return { x: xOf(C(h)), y: yOf(R(h)) }; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function distMM(a,b){ return (Math.abs(C(a)-C(b)) + Math.abs(R(a)-R(b))) * 2.54; }
function adjacent(a,b){ return Math.abs(C(a)-C(b)) + Math.abs(R(a)-R(b)) === 1; }
/* 盤の中にあり、かつ四隅の欠けに当たっていないこと。
   欠けは穴が存在しないので、部品も線もそこへは動かせない */
function inBoard(c,r){
  if (!(c >= 1 && c <= NCOL && r >= 0 && r < ROWS.length)) return false;
  return !NOTCH.has(ROWS[r] + c);
}

/* ===========================================================
   台帳（毎回 L から組み直す）
   =========================================================== */
function blockList(){
  const bs = [];
  for (const p of L.PARTS){
    bs.push({
      id:'part:'+p.id, name:p.name, ref:p,
      holes: () => p.kind === 'tr' ? Object.keys(p.pins).map(k => p.pins[k]) : [p.a, p.b],
      set: hs => { if (p.kind === 'tr'){ Object.keys(p.pins).forEach((k,i) => p.pins[k] = hs[i]); }
                   else { p.a = hs[0]; p.b = hs[1]; } },
      seeds: () => p.kind === 'tr'
        ? Object.keys(p.pins).map(k => ({ hole:p.pins[k], net:p.nets[k] }))
        : [{ hole:p.a, net:p.nets.a }, { hole:p.b, net:p.nets.b }],
      under: !!p.under,
    });
  }
  const pinBlock = (o, name) => ({
    id:'blk:'+o.id, name, ref:o,
    holes: () => o.pins.map(p => p.hole),
    set: hs => o.pins.forEach((p,i) => p.hole = hs[i]),
    seeds: () => o.pins.filter(p => p.net).map(p => ({ hole:p.hole, net:p.net })),
    under: false,
  });
  bs.push(pinBlock(L.RELAY, L.RELAY.name));
  bs.push(pinBlock(L.BUTTON, L.BUTTON.name));
  for (const c of L.PHCONN) bs.push(pinBlock(c, c.name));
  for (const hd of L.HEADERS) bs.push(pinBlock(hd, hd.label));
  return bs;
}

/* 穴 → 挿さる導線 */
function insertions(){
  const ins = {};
  const add = (h, label) => { (ins[h] = ins[h] || []).push(label); };
  for (const b of blockList()) for (const h of b.holes()) add(h, b.name);
  for (const j of L.JUMPERS){
    add(j.path[0], 'ジャンパ'+j.id);
    add(j.path[j.path.length-1], 'ジャンパ'+j.id);
  }
  return ins;
}

/* union-find で、ブリッジ・ジャンパ・部品内部結線から
   電気的に繋がった穴のかたまりを作る。ネットは端子の宣言から伝播させる。 */
function solveNets(){
  const parent = {};
  const find = a => { if (parent[a] === undefined) parent[a] = a;
                      while (parent[a] !== a){ parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const uni = (a,b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  const touch = h => { find(h); };

  for (const b of L.BRIDGES){
    for (let i = 1; i < b.path.length; i++) uni(b.path[i-1], b.path[i]);
    b.path.forEach(touch);
  }
  for (const j of L.JUMPERS){ uni(j.path[0], j.path[j.path.length-1]); j.path.forEach(touch); }
  /* リレーの COM は内部で2本に振り出されている。
     ⚠ 穴の名前で持つと、リレーを動かした瞬間に取り残されて「断線」の誤検出になる
     （2026-08-11 に実際に踏んだ）。役割（fn）で引くこと。 */
  const coms = L.RELAY.pins.filter(p => p.fn === 'COM');
  for (let i = 1; i < coms.length; i++) uni(coms[0].hole, coms[i].hole);

  /* 端子の宣言をシードにしてネットを配る */
  const seeds = [];
  for (const b of blockList()) for (const s of b.seeds()){ touch(s.hole); seeds.push(s); }

  const groupNet = {}, conflicts = [];
  for (const s of seeds){
    const g = find(s.hole);
    if (groupNet[g] && groupNet[g] !== s.net){
      conflicts.push({ a:groupNet[g], b:s.net, hole:s.hole });
    } else groupNet[g] = s.net;
  }
  const holeNet = {};
  for (const h in parent){ const g = find(h); if (groupNet[g]) holeNet[h] = groupNet[g]; }

  /* ネットごとの島の数 */
  const islands = {};
  for (const h in holeNet){
    const n = holeNet[h], g = find(h);
    (islands[n] = islands[n] || new Set()).add(g);
  }
  return { holeNet, conflicts, islands, find };
}

/* 部品の胴の bbox（論理座標・列は1起点、行は1起点） */
/* 部品の胴が占める箱。すべて orientedBox で出すので、回しても追従する */
function bodyBoxes(){
  const out = [];
  const add = (name, hs, longMM, shortMM) =>
    out.push(Object.assign({ name, own:new Set(hs) }, orientedBox(hs, longMM, shortMM)));
  for (const p of L.PARTS){
    if (p.under) continue;
    const hs = p.kind === 'tr' ? Object.keys(p.pins).map(k=>p.pins[k]) : [p.a, p.b];
    add(p.name, hs, p.body.L, p.body.W);
  }
  add(L.RELAY.name, L.RELAY.pins.map(p=>p.hole), L.RELAY.bodyL, L.RELAY.bodyW);
  add(L.BUTTON.name, L.BUTTON.pins.map(p=>p.hole), L.BUTTON.bodyW, L.BUTTON.bodyH);
  for (const c of L.PHCONN) add('PH '+c.id, c.pins.map(p=>p.hole), c.body.L, c.body.W);
  for (const hd of L.HEADERS)
    add(hd.label, hd.pins.map(p=>p.hole), hd.pins.length * 2.54, 2.5);
  return out;
}

/* ジャンパの経路が通る穴（両端を含む） */
function jumperCells(j){
  const seq = [j.path[0]];
  for (let i = 0; i < j.path.length-1; i++){
    const a = j.path[i], b = j.path[i+1];
    const dc = Math.sign(C(b)-C(a)), dr = Math.sign(R(b)-R(a));
    let c = C(a), r = R(a);
    while (c !== C(b) || r !== R(b)){ c += dc; r += dr; seq.push(H(c,r)); }
  }
  return seq;
}

/* ===========================================================
   物理検査
   =========================================================== */
let NET = solveNets();
let WARN = [];

function check(){
  NET = solveNets();
  const W = [];
  const INS = insertions();
  const hn = NET.holeNet;

  /* 1穴1本 */
  for (const h in INS) if (INS[h].length >= 2)
    W.push({ hole:h, sev:'err', msg:`<code>${h}</code>: 導線${INS[h].length}本（${INS[h].join('・')}）— 1穴に入るのは1本` });

  /* ブリッジの隣接 */
  for (const b of L.BRIDGES) for (let i = 0; i < b.path.length-1; i++)
    if (!adjacent(b.path[i], b.path[i+1]))
      W.push({ sev:'err', hole:b.path[i+1], msg:`ブリッジ <code>${b.path.join('–')}</code>: ${b.path[i]}→${b.path[i+1]} が隣接していない` });

  /* 短絡（別ネットが1つのかたまりに入った） */
  for (const c of NET.conflicts)
    W.push({ sev:'err', hole:c.hole, msg:`🔴 短絡: <code>${c.hole}</code> で <b>${NETS[c.a]?.label||c.a}</b> と <b>${NETS[c.b]?.label||c.b}</b> が繋がっている` });

  /* 断線（同じネットが2つ以上の島に分かれた） */
  for (const n in NET.islands) if (NET.islands[n].size > 1)
    W.push({ sev:'err', msg:`⚠ 断線: <b>${NETS[n]?.label||n}</b> が ${NET.islands[n].size} つの島に分かれている（繋がっていない）` });

  /* 🔴 +5V と GND が隣り合うパッドに来ていないか（2026-08-14 ユーザー指摘で追加）。
     ほかのネットどうしのはんだブリッジは動作不良で済むが、この2つが繋がると
     電源が落ちるか部品が焼ける。このレイアウトが守ってきた一番の性質なので、
     崩れた瞬間に鳴るようにしておく。
     ⚠ 同じ部品・同じコネクタの足どうしは除く。デカップリングコンデンサは必ず
     +5V と GND にまたがるし、ヘッダのピンの並びはこちらでは選べない。
     ⚠ 見るのは「真隣」だけでよい。はんだが渡るのは隣り合うパッドどうしで、
     1つ飛ばし（5.08mm）は距離が違う。 */
  {
    const blocks = blockList().map(b => new Set(b.holes()));
    const samePart = (a, b) => blocks.some(s => s.has(a) && s.has(b));
    const v5 = [], gnd = [];
    for (const h in hn){
      if (hn[h] === 'V5') v5.push(h); else if (hn[h] === 'GND') gnd.push(h);
    }
    for (const a of v5) for (const b of gnd)
      if (adjacent(a, b) && !samePart(a, b))
        W.push({ hole:a, sev:'err',
          msg:`🔴 電源短絡のリスク: <code>${a}</code>（+5V）と <code>${b}</code>（GND）が隣り合うパッド — はんだが渡ると電源が落ちる` });
  }

  /* ネットが未割り当ての線（新しく引いたまま放置） */
  for (const j of L.JUMPERS) if (j.net === 'NONE')
    W.push({ jid:j.id, hole:j.path[0], sev:'warn',
             msg:`ジャンパ${j.id} <code>${j.path[0]}→${j.path[j.path.length-1]}</code>: ネットが未割り当て — 選んでプルダウンで決める` });
  for (const b of L.BRIDGES) if (b.net === 'NONE')
    W.push({ hole:b.path[0], sev:'warn',
             msg:`ブリッジ <code>${b.path.join('–')}</code>: ネットが未割り当て` });

  /* 宣言したネットと、実際に繋がった先のネットが食い違う（色だけ合っている状態） */
  for (const j of L.JUMPERS){
    if (j.net === 'NONE') continue;
    const a = hn[j.path[0]], b = hn[j.path[j.path.length-1]];
    for (const [h, n] of [[j.path[0], a], [j.path[j.path.length-1], b]])
      if (n && n !== j.net)
        W.push({ jid:j.id, hole:h, sev:'warn',
          msg:`ジャンパ${j.id}: <b>${NETS[j.net]?NETS[j.net].label:j.net}</b> と書いてあるが、<code>${h}</code> は実際には <b>${NETS[n]?NETS[n].label:n}</b> に繋がっている` });
  }

  /* 被覆線の長さ。両端の剥き代を引くと絶縁が残らない */
  for (const j of L.JUMPERS){
    let len = 0;
    for (let i = 0; i < j.path.length-1; i++) len += distMM(j.path[i], j.path[i+1]);
    if (len < 4*2.54 - 0.01)
      W.push({ jid:j.id, hole:j.path[0], sev:'err',
        msg:`ジャンパ${j.id} <code>${j.path.join('→')}</code>: 全長${len.toFixed(1)}mm — 剥き代を引くと絶縁が残らない（裏のブリッジにするか10mm以上に）` });
  }

  /* ジャンパの区間（重なり・交差） */
  const segs = [];
  for (const j of L.JUMPERS) for (let i = 0; i < j.path.length-1; i++){
    const a = j.path[i], b = j.path[i+1], vert = C(a) === C(b);
    segs.push({ id:j.id, vert, fix: vert ? C(a) : R(a),
                lo: Math.min(vert?R(a):C(a), vert?R(b):C(b)),
                hi: Math.max(vert?R(a):C(a), vert?R(b):C(b)) });
  }
  for (let i = 0; i < segs.length; i++) for (let k = i+1; k < segs.length; k++){
    const s = segs[i], t = segs[k];
    if (s.id === t.id) continue;
    if (s.vert === t.vert && s.fix === t.fix && s.lo < t.hi && t.lo < s.hi)
      W.push({ jid:s.id, sev:'err', msg:`ジャンパ${s.id} と ${t.id} が同じ${s.vert?'列':'行'}で重なる` });
    /* 直交する交差は【黄】。被覆線どうしなので短絡はしないが、
       増えるほど組みにくくなるので数として見せる（2026-08-11 ユーザー:
       「構造的に交差は仕方がない」）。物理的に不可能なのは上の同一線上の重なりだけ */
    if (s.vert !== t.vert){
      const v = s.vert?s:t, hz = s.vert?t:s;
      if (v.fix > hz.lo && v.fix < hz.hi && hz.fix > v.lo && hz.fix < v.hi)
        W.push({ jid:s.id, sev:'warn', msg:`ジャンパ${s.id} と ${t.id} が交差する（被覆線どうしなので短絡はしない）` });
    }
  }

  /* 端の剥き線が別ネットのライブパッドに近い */
  const live = new Set(Object.keys(INS));
  for (const b of L.BRIDGES) for (const h of b.path) live.add(h);
  for (const j of L.JUMPERS){
    const cells = jumperCells(j), inner = cells.slice(1, -1);
    inner.forEach((h, idx) => {
      if (!live.has(h)) return;
      if (hn[h] && hn[h] === j.net) return;
      const dS = idx + 1, dE = inner.length - idx;
      if (dS < 2 || dE < 2)
        W.push({ jid:j.id, hole:h, sev:'err',
          msg:`ジャンパ${j.id}: 端の剥き線の範囲にライブパッド <code>${h}</code>${hn[h]?`（${NETS[hn[h]]?.label||hn[h]}）`:''} — 短絡リスク` });
    });
  }

  /* 胴と使用穴の当たり。穴の中心が胴の箱の中なら【赤】、
     覆ってはいないが縁が CLEAR より近ければ【黄】。
     ⚠ ここで見るのは INS（部品の足とジャンパの端）だけでよい。ブリッジとレールは
     半田面を這うので、部品面に立つ胴とは面が違って当たらない。
     CLEAR=1.0mm は「隣の穴から立ち上がる足が胴に当たり始める」目安。ピッチ2.54で
     隣の穴にふつうに並ぶ部品（ピンヘッダ1.29mm・0.1µF 1.56mm）はこれで鳴らない */
  const under = new Set();
  for (const p of L.PARTS) if (p.under){ under.add(p.a); under.add(p.b); }
  const BX = bodyBoxes();
  const CLEAR = 1.0;
  for (const bx of BX) for (const h in INS){
    if (bx.own.has(h) || under.has(h)) continue;
    const c = C(h), r = R(h)+1;
    if (c > bx.c0 && c < bx.c1 && r > bx.r0 && r < bx.r1){
      W.push({ hole:h, sev:'err', msg:`${bx.name} の胴が <code>${h}</code>（${INS[h].join('・')}）を覆う` });
      continue;
    }
    const dc = Math.max(bx.c0 - c, c - bx.c1, 0), dr = Math.max(bx.r0 - r, r - bx.r1, 0);
    const gap = Math.hypot(dc, dr) * 2.54;
    if (gap < CLEAR)
      W.push({ hole:h, sev:'warn',
        msg:`${bx.name} の胴が <code>${h}</code>（${INS[h].join('・')}）に ${gap.toFixed(2)}mm まで迫る — 足を立てる隙間がない` });
  }

  /* ジャンパが胴の上を通る */
  for (const j of L.JUMPERS) for (let i = 0; i < j.path.length-1; i++){
    const a = j.path[i], b = j.path[i+1], vert = C(a) === C(b);
    const fix = vert ? C(a) : R(a)+1;
    const lo = Math.min(vert?R(a)+1:C(a), vert?R(b)+1:C(b));
    const hi = Math.max(vert?R(a)+1:C(a), vert?R(b)+1:C(b));
    for (const bx of BX){
      const fLo = vert?bx.c0:bx.r0, fHi = vert?bx.c1:bx.r1;
      const sLo = vert?bx.r0:bx.c0, sHi = vert?bx.r1:bx.c1;
      if (fix > fLo && fix < fHi && lo < sHi && hi > sLo)
        W.push({ jid:j.id, sev:'err', msg:`ジャンパ${j.id} の <code>${a}→${b}</code> が ${bx.name} の胴の上を通る` });
    }
  }

  /* 抵抗の足の折り返し */
  for (const p of L.PARTS){
    if (p.kind !== 'res') continue;
    const span = distMM(p.a, p.b), gap = span - p.body.L;
    if (gap < 2)
      W.push({ sev:'err', msg:`${p.name}（<code>${p.a}–${p.b}</code>）: 胴${p.body.L}mm・穴間${span.toFixed(1)}mm — 折り返し余裕${gap.toFixed(1)}mm` });
  }
  /* 🔴 「コンデンサの胴が穴間より広い」の黄色は廃止した（2026-08-13）。
     セラコンは足ピッチ2.54・胴4.5が普通の形なので、置いた瞬間に必ず鳴る常時点灯だった。
     本当に当たるかどうかは上の「胴と使用穴の当たり」が距離で見ているので、そちらに任せる */
  /* 板からはみ出す */
  for (const b of blockList()) for (const h of b.holes())
    if (!inBoard(C(h), R(h))) W.push({ sev:'err', msg:`${b.name} が板の外（<code>${h}</code>）` });

  WARN = W;
}

/* ===========================================================
   描画
   =========================================================== */
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}
function tip(node, text){
  const t = document.createElementNS(NS, 'title'); t.textContent = text; node.appendChild(t);
}
function op(net){ return activeNet && net !== activeNet ? 0.14 : 1; }
function netColor(n){ return cssVar(NETS[n] ? NETS[n].css : '--sub'); }

function draw(){
  svg.innerHTML = '';
  labelSlots = [];
  const W = PADX*2 + (NCOL-1)*PITCH, Hh = PADY*2 + (ROWS.length-1)*PITCH;
  svg.setAttribute('width', W + GUTTER*2);
  /* ⚠ 下辺のコネクタのラベルは段違いに落ちるので、その分の余白を足しておく
     （足りないと一番下のラベルが切れる。2026-08-14） */
  svg.setAttribute('height', Hh + 84);
  svg.setAttribute('viewBox', `${-GUTTER} -20 ${W + GUTTER*2} ${Hh + 84}`);
  el('rect', { x:16, y:18, width:W-32, height:Hh-36, rx:10,
               fill:cssVar('--board'), stroke:cssVar('--line') });

  drawBridges(); drawBlocks(); drawBridgeHits();
  drawAxis(); drawHoles();
  drawJumpers(); drawParts(); drawMarks(); drawNewWire();
  /* ⚠ 霧は drawSelection の【前】。あとに置くと、点の編集ハンドルと「＋」まで
     霧の下に沈んで掴めなくなる */
  drawSpotlight(); drawSelection();
}

/* 裏の裸線。
   🔒 2026-08-14 ユーザー決定「配線ブリッジにして自動的にレールで見せる」。
   レールを別の型で持っていた頃は、画面から作れず・曲げられず・ブリッジと二重に
   管理することになっていた。データはブリッジ1本に統一して、レールは見せ方だけにした。

   🔴 レールかどうかは「長さ」では決まらない。レールは1本の連続した裸線なので、
   足の出ているパッドの上は通れない（通したらその穴がつぶれる）。
   ⚠ 端も空き穴で終わらせて、足へはブリッジで渡す。これはユーザーの工作方法で、
   工作精度を要求しないための決め事なので、ここを緩めないこと（2026-08-14）。
   例: ベース節点 G5–G4–F4–E4–D4–C4 は 6穴あるが、D4 に 10kΩ の足が入っているので
   1本の裸線では通せない。レールになるのは G4〜E4 の空き区間だけ。

   したがって、足の入っていない穴が RAIL_MIN 個以上つづく区間だけを
   太線＋ネット名で描き、残りはブリッジとして細く描く。 */
const RAIL_MIN = 4;
function railRuns(path, INS){
  const runs = [];
  let cur = [];
  const flush = () => { if (cur.length >= RAIL_MIN) runs.push(cur); cur = []; };
  for (const h of path){ if (INS[h]) flush(); else cur.push(h); }
  flush();
  return runs;
}
function drawBridges(){
  const INS = insertions();
  for (const b of L.BRIDGES){
    const ps = b.path.map(pt), c = netColor(b.net);
    el('polyline', { points: ps.map(p=>`${p.x},${p.y}`).join(' '), fill:'none',
                     stroke:c, 'stroke-width':5, 'stroke-linecap':'round',
                     'stroke-linejoin':'round', opacity: op(b.net)*.5, 'pointer-events':'none' });
    for (const run of railRuns(b.path, INS)){
      const qs = run.map(pt);
      el('polyline', { points: qs.map(p=>`${p.x},${p.y}`).join(' '), fill:'none',
                       stroke:c, 'stroke-width':7, 'stroke-linecap':'round',
                       'stroke-linejoin':'round', opacity: op(b.net), 'pointer-events':'none' });
      /* ラベルは真ん中の区間の脇。縦に走っていれば右へ、横なら下へ逃がす */
      const i = Math.floor((qs.length-1)/2), a = qs[i], z = qs[i+1];
      const vert = Math.abs(a.x - z.x) < 1;
      const lb = NETS[b.net] ? NETS[b.net].label : b.net;
      const lx = (a.x+z.x)/2 + (vert?13:0);
      /* ⚠ レールの名前も段ずらしに通す。通さないと、レールどうしで重なるし
         （2026-08-15 に GND が2つ重なった）、コネクタのラベルがこの上に降りてくる */
      const ly = placeLabel(lx, (a.y+z.y)/2 + (vert?4:18),
                            labelWidth(lb, 11), vert?'start':'middle', 13);
      const t = el('text', { x:lx, y:ly,
        'text-anchor': vert?'start':'middle', fill:c, 'font-size':11, 'font-weight':700,
        opacity:op(b.net), 'pointer-events':'none' });
      t.textContent = lb;
    }
  }
}

/* ブリッジの当たり判定は、部品の枠より上に置く（下に敷くと掴めない） */
function drawBridgeHits(){
  L.BRIDGES.forEach((b,i) => {
    const ps = b.path.map(pt);
    const hit = el('polyline', { points: ps.map(p=>`${p.x},${p.y}`).join(' '), fill:'none',
      stroke:'transparent', 'stroke-width':11, 'stroke-linejoin':'round',
      cursor: mirrored ? 'default' : 'move' });
    hit.dataset.bridge = i;
    tip(hit, `ブリッジ（${NETS[b.net] ? NETS[b.net].label : b.net}・裏）: ${b.path.join('–')}`);
  });
}

function drawNewWire(){
  if (!drag || drag.mode !== 'new') return;
  const a = pt(H(drag.from.c, drag.from.r)), b = pt(H(drag.to.c, drag.to.r));
  const corner = pt(H(drag.to.c, drag.from.r));
  el('polyline', { points:`${a.x},${a.y} ${corner.x},${corner.y} ${b.x},${b.y}`, fill:'none',
    stroke:cssVar('--sel'), 'stroke-width':3, 'stroke-dasharray':'6 4',
    'stroke-linejoin':'round', opacity:.8, 'pointer-events':'none' });
}

function drawBlocks(){
  /* リレー */
  const rHoles = L.RELAY.pins.map(p=>p.hole);
  const rb = boxPx(orientedBox(rHoles, L.RELAY.bodyL, L.RELAY.bodyW));
  const rg = el('rect', { x:rb.x, y:rb.y, width:rb.w, height:rb.h,
    rx:6, fill:cssVar('--in'), 'fill-opacity':.09, stroke:cssVar('--in'), 'stroke-width':1.5,
    'stroke-dasharray':'6 4', opacity: activeNet?.3:.95, cursor:'move' });
  rg.dataset.block = 'blk:RELAY';
  tip(rg, `${L.RELAY.name} 本体 ${L.RELAY.bodyW} × ${L.RELAY.bodyL}mm（実寸）`);
  const rl = el('text', { x:rb.x+rb.w/2, y:rb.y-6, 'text-anchor':'middle',
    fill:cssVar('--in'), 'font-size':11, opacity: activeNet?.3:1 });
  rl.textContent = L.RELAY.name;
  for (const p of L.RELAY.pins) pinMark(p.hole, p.fn, cssVar('--fg'), 'up');

  /* ボタン */
  const bHoles = L.BUTTON.pins.map(p=>p.hole);
  const bb = boxPx(orientedBox(bHoles, L.BUTTON.bodyW, L.BUTTON.bodyH));
  const bg = el('rect', { x:bb.x, y:bb.y, width:bb.w, height:bb.h, rx:5,
    fill:cssVar('--jump'), 'fill-opacity':.07, stroke:cssVar('--jump'), 'stroke-width':1.5,
    'stroke-dasharray':'5 4', opacity: activeNet?.2:.95, cursor:'move' });
  bg.dataset.block = 'blk:BUTTON';
  tip(bg, `${L.BUTTON.name} 本体 ${L.BUTTON.bodyW} × ${L.BUTTON.bodyH}mm。レバー根本=${L.BUTTON.pins[0].hole}`);
  for (const p of L.BUTTON.pins) pinMark(p.hole, p.fn, cssVar('--jump'), 'right');
  const blab = el('text', { x:bb.x+bb.w/2, y:bb.y+bb.h+16, 'text-anchor':'middle',
    fill:cssVar('--jump'), 'font-size':10, 'font-weight':700, opacity: activeNet?.2:1 });
  blab.textContent = '会話ボタン（NCは繋がない）';

  /* PH */
  for (const c of L.PHCONN){
    const hs = c.pins.map(p=>p.hole);
    const box = boxPx(orientedBox(hs, c.body.L, c.body.W));
    const g = el('rect', { x:box.x, y:box.y, width:box.w, height:box.h, rx:4,
      fill:cssVar('--spk'), 'fill-opacity':.09, stroke:cssVar('--spk'), 'stroke-width':1.5,
      opacity: activeNet?.2:.95, cursor:'move' });
    g.dataset.block = 'blk:'+c.id;
    tip(g, `PH2.0 2P ${c.name}（実寸 ${c.body.W} × ${c.body.L}mm）⬜トップ/サイドは現物合わせ`);
    for (const p of c.pins) pinMark(p.hole, p.fn, cssVar('--spk'), 'right');
    exitArrow(box, c.exit, c.name, cssVar('--spk'));
  }

  /* ヘッダ */
  for (const hd of L.HEADERS){
    const hs = hd.pins.map(p=>p.hole);
    const box = boxPx(orientedBox(hs, hd.pins.length * 2.54, 2.5));
    const g = el('rect', { x:box.x, y:box.y, width:box.w, height:box.h, rx:3,
      fill:cssVar('--fg'), 'fill-opacity':.09, stroke:cssVar('--fg'), 'stroke-width':1.5,
      opacity: activeNet?.2:1, cursor:'move' });
    g.dataset.block = 'blk:'+hd.id;
    tip(g, hd.label);
    const vert = hd.pins.length>1 && C(hd.pins[0].hole) === C(hd.pins[1].hole);
    for (const p of hd.pins) pinMark(p.hole, p.fn, cssVar('--fg'),
      vert ? (hd.exit==='right'?'right':'left') : (hd.exit==='down'?'down':'downtext'));
    /* 🔴 2026-08-14: 下辺にコネクタを3つ並べたらラベルが重なって読めなくなった。
       ぶつかるものだけ1段ずらして、矢印の位置と細い線で結ぶ（ユーザー指摘）。
       ⚠ 上向き（XIAO）は列番号の目盛りと当たるので、基準を -22 まで上げてある */
    const lx = box.x + box.w/2;
    /* 🔴 2026-08-14: ラベルの上下は「出口の向き」ではなく「板のどちら側に居るか」で決める
       （ユーザー指摘）。回転させると出口が上を向くことがあり、そのとき下辺のコネクタの
       説明が板の中へ飛び込んでいた。位置で決めれば回しても飛ばない */
    const down = (box.y + box.h/2) > PADY + (ROWS.length-1)*PITCH/2;
    const ly0 = down ? box.y + box.h + 30 : box.y - 22;
    const ly = placeLabel(lx, ly0, labelWidth(hd.label, 11), 'middle', down ? 14 : -14);
    if (Math.abs(ly - ly0) > 1)
      el('line', { x1:lx, y1: down ? ly0-4 : ly0+4, x2:lx, y2: down ? ly-10 : ly+4,
                   stroke:cssVar('--fg'), 'stroke-width':1, opacity: activeNet?.2:.45 });
    const lab = el('text', { x:lx, y: ly,
      'text-anchor':'middle', fill:cssVar('--fg'), 'font-size':11, 'font-weight':700,
      opacity: activeNet?.2:1 });
    lab.textContent = hd.label;
  }
}

/* 線が外へ抜けていく向きの矢印。回転すると exit も回る */
/* 🔴 2026-08-14 追加。下辺にコネクタを3つ並べたら、出口のラベルが同じ高さに出て
   重なって読めなくなった（ユーザー指摘）。置いた場所を覚えておいて、
   ぶつかるなら1段ずらす。⚠ 幅は実測できないので、全角10px・半角5.5px で見積もる */
let labelSlots = [];
function labelWidth(s, fs){
  fs = fs || 10;
  let w = 0;
  for (const ch of s) w += ch.codePointAt(0) > 0x2e80 ? fs : fs*0.55;
  return w;
}
function placeLabel(x, y, w, anchor, step){
  const x0 = anchor === 'end' ? x - w : anchor === 'start' ? x : x - w/2;
  const hit = yy => labelSlots.some(s =>
    Math.abs(s.y - yy) < 11 && x0 < s.x1 && s.x0 < x0 + w);
  let yy = y;
  for (let i = 0; i < 8 && hit(yy); i++) yy += step;
  labelSlots.push({ x0, x1: x0 + w, y: yy });
  return yy;
}

function exitArrow(box, exit, label, color){
  const cx = box.x + box.w/2, cy = box.y + box.h/2;
  let dx = 0, dy = 0;
  if (exit === 'left') dx = -1; else if (exit === 'right') dx = 1;
  else if (exit === 'up') dy = -1; else dy = 1;
  if (mirrored) dx = -dx;
  const sx = cx + dx*(box.w/2), sy = cy + dy*(box.h/2);
  const ex = sx + dx*22, ey = sy + dy*22;
  el('line', { x1:sx, y1:sy, x2:ex, y2:ey, stroke:color, 'stroke-width':2,
               opacity: activeNet?.15:.9 });
  el('path', { d: dx ? `M ${ex} ${ey} l ${-dx*6} -4 l 0 8 Z`
                     : `M ${ex} ${ey} l -4 ${-dy*6} l 8 0 Z`,
               fill:color, opacity: activeNet?.15:.9 });
  const anchor = dx<0 ? 'end' : dx>0 ? 'start' : 'middle';
  const tx = ex + dx*7;
  const ty0 = ey + (dy>0 ? 12 : dy<0 ? -6 : 3.5);
  const ty = placeLabel(tx, ty0, labelWidth(label), anchor, dy<0 ? -13 : 13);
  /* ずらした分だけ、矢印の先とラベルを細い線で繋ぐ（どのコネクタの名前か分かるように） */
  if (Math.abs(ty - ty0) > 1)
    el('line', { x1:tx, y1:ty0 - (dy>0?3:-3), x2:tx, y2:ty - (dy>0?9:-3),
                 stroke:color, 'stroke-width':1, opacity: activeNet?.15:.5 });
  const t = el('text', { x: tx, y: ty,
    fill:color, 'text-anchor': anchor,
    'font-size':10, 'font-weight':700, opacity: activeNet?.15:.95 });
  t.textContent = label;
}

function pinMark(hole, fn, color, where){
  const q = pt(hole);
  el('circle', { cx:q.x, cy:q.y, r:6.5, fill:'none', stroke:color, 'stroke-width':2,
                 opacity: activeNet?.18:1, 'pointer-events':'none' });
  if (!fn) return;
  let x=q.x, y=q.y-11, anchor='middle';
  if (where === 'right'){ x=q.x+13; y=q.y+4; anchor='start'; }
  else if (where === 'left'){ x=q.x-13; y=q.y+4; anchor='end'; }
  else if (where === 'down'){ y=q.y+24; }
  else if (where === 'downtext'){ y=q.y+26; }
  const t = el('text', { x, y, 'text-anchor':anchor, fill:color, 'font-size':10,
                         'font-weight':700, opacity: activeNet?.18:1, 'pointer-events':'none' });
  t.textContent = fn;
  /* ⚠ 端子名も「置いた場所」に登録しておく。登録しないと、コネクタのラベルが
     端子名の上に降りてくる（2026-08-14 に実際に重なった） */
  const w = labelWidth(fn, 10);
  labelSlots.push({ x0: anchor==='end' ? x-w : anchor==='start' ? x : x-w/2,
                    x1: (anchor==='end' ? x-w : anchor==='start' ? x : x-w/2) + w, y });
}

function drawAxis(){
  for (let i = 0; i < ROWS.length; i++){
    const t = el('text', { x:22, y:PADY+i*PITCH+4, fill:cssVar('--sub'), 'font-size':11 });
    t.textContent = ROWS[i];
  }
  for (let c = 1; c <= NCOL; c++){
    const t = el('text', { x:xOf(c), y:30, 'text-anchor':'middle', fill:cssVar('--sub'), 'font-size':11 });
    t.textContent = c;
  }
}

function drawHoles(){
  const hn = NET.holeNet;
  for (let ri = 0; ri < ROWS.length; ri++) for (let c = 1; c <= NCOL; c++){
    const h = H(c,ri);
    if (NOTCH.has(h)) continue;                 /* 四隅の欠け。穴が無い */
    const net = hn[h], p = pt(h);
    el('circle', { cx:p.x, cy:p.y, r: net?5.5:3,
      fill: net ? netColor(net) : cssVar('--hole'),
      opacity: net ? op(net) : (activeNet?.12:.45), 'pointer-events':'none' });
  }
  /* 取り付け穴（4-φ3.2）。欠けた2穴の真ん中あたりに開いている */
  for (const [a,b] of [['A1','B1'],['R1','S1'],['A27','B27'],['R27','S27']]){
    const p = pt(a), q = pt(b);
    el('circle', { cx:(p.x+q.x)/2, cy:(p.y+q.y)/2, r:9, fill:cssVar('--bg'),
      stroke:cssVar('--sub'), 'stroke-width':1.5, opacity:.7, 'pointer-events':'none' });
  }
}

function drawJumpers(){
  for (const j of L.JUMPERS){
    const c = netColor(j.net), ps = j.path.map(pt);
    const pts = ps.map(p=>`${p.x},${p.y}`).join(' ');
    /* 当たり判定用の太い透明線 */
    const hit = el('polyline', { points:pts, fill:'none', stroke:'transparent',
      'stroke-width':16, 'stroke-linejoin':'round', cursor: mirrored?'default':'move' });
    hit.dataset.jumper = j.id;
    tip(hit, `ジャンパ${j.id}（${NETS[j.net].label}）: ${j.path.join(' → ')}${j.what?' — '+j.what:''}`);
    el('polyline', { points:pts, fill:'none', stroke:c, 'stroke-width':2.5,
      'stroke-linecap':'round', 'stroke-linejoin':'round', 'stroke-dasharray':'7 4',
      opacity:op(j.net), 'pointer-events':'none' });
    for (let i = 1; i < ps.length-1; i++)
      el('circle', { cx:ps[i].x, cy:ps[i].y, r:3, fill:c, opacity:op(j.net), 'pointer-events':'none' });
    const mi = Math.floor((ps.length-1)/2), a = ps[mi], b = ps[mi+1] || ps[ps.length-1];
    /* ⚠ 交差する2本は中点が同じ場所に来ることがあり、番号が重なって読めなくなる
       （2026-08-15 に ⑩ と ⑭ で発生）。ここも段ずらしに通す */
    const jx = (a.x+b.x)/2;
    const jy = placeLabel(jx, (a.y+b.y)/2-8, labelWidth(j.id, 12), 'middle', -14);
    /* 🔴 2026-08-18（ユーザー要望）。番号そのものを掴めるようにした。
       番号は段ずらしで線から離れた所へ逃げるので、線を狙っても当たらないことがある。
       ⚠ data-pick は【選ぶだけ】で、ドラッグは始めない。はんだ付けの済んだ板を
       見ながら押す物なので、確認のつもりで押して線が動いてはいけない */
    const pick = el('circle', { cx:jx, cy:jy-4, r:11, fill:'transparent', cursor:'pointer' });
    pick.dataset.pick = 'jumper:' + j.id;
    tip(pick, `ジャンパ${j.id} を光らせる（もう一度押すと消える）`);
    const t = el('text', { x:jx, y:jy, 'text-anchor':'middle', fill:c,
      'font-size':12, 'font-weight':700, opacity:op(j.net), 'pointer-events':'none' });
    t.textContent = j.id;
  }
}

function drawParts(){
  for (const p of L.PARTS){
    if (p.kind === 'tr'){ drawTr(p); continue; }
    const a = pt(p.a), b = pt(p.b);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, vert = Math.abs(a.x-b.x) < 1;
    const Lp = p.body.L*MM, Wp = p.body.W*MM;
    const o = activeNet && ![p.nets.a,p.nets.b].includes(activeNet) ? .18 : 1;
    el('line', { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:cssVar('--fg'),
                 'stroke-width':1.6, opacity:o*.75, 'pointer-events':'none' });
    const w = vert?Wp:Lp, h = vert?Lp:Wp;
    /* 胴はどれも角の丸い四角。0.1µF は積層セラミックで実物も平たい四角なので、
       楕円はやめた（2026-08-13 ユーザー指摘）。種類の見分けは中の回路記号が受け持つ */
    const body = el('rect', { x:mx-w/2, y:my-h/2, width:w, height:h,
      rx: p.kind==='cap' ? Math.min(w,h)*0.28 : (p.kind==='res'?3:2),
      fill:cssVar('--panel'), stroke:cssVar('--fg'), 'stroke-width':1.6, opacity:o,
      cursor: mirrored?'default':'move' });
    body.dataset.block = 'part:'+p.id;
    tip(body, `${p.name} 実寸 ${p.body.L} × ${p.body.W}mm${p.under?'（半田面）':''}`);
    let cs = 1;                    /* ダイオードの向き。足の軸の正方向がカソードなら +1 */
    if (p.kind === 'diode'){
      const ca = pt(p.cath === 'a' ? p.a : p.b);
      cs = vert ? (ca.y>my?1:-1) : (ca.x>mx?1:-1);
      if (vert) el('rect', { x:mx-w/2, y:my+cs*(h/2)-(cs>0?4:0), width:w, height:4,
                             fill:cssVar('--fg'), opacity:o, 'pointer-events':'none' });
      else      el('rect', { x:mx+cs*(w/2)-(cs>0?4:0), y:my-h/2, width:4, height:h,
                             fill:cssVar('--fg'), opacity:o, 'pointer-events':'none' });
    }
    drawSym(p.kind, mx, my, Lp, Wp, vert, o, cs);
    const ly = vert ? my+4 : (p.under ? my+Wp/2+34 : my-Wp/2-8);
    if (p.under && !vert)
      el('line', { x1:mx, y1:my+Wp/2, x2:mx, y2:my+Wp/2+24, stroke:cssVar('--sub'),
                   'stroke-width':1, 'stroke-dasharray':'2 2', opacity:o*.8, 'pointer-events':'none' });
    const t = el('text', { x: vert?mx+20:mx, y:ly, 'text-anchor': vert?'start':'middle',
      fill:cssVar('--fg'), 'font-size':11, 'font-weight':700, opacity:o, 'pointer-events':'none' });
    t.textContent = p.under ? `${p.name}（裏）` : p.name;
  }
}

/* 胴の中に回路記号を描く。足の並ぶ方向を x とした水平の姿で描いてから、
   縦置きならまとめて 90° 回す（トランジスタの胴と同じやり方）。
   ax は足の並ぶ方向の長さ、cw はそれに直交する幅。どちらも px。
   cs はダイオードの向きで、+1 なら x の正方向がカソード */
function drawSym(kind, mx, my, ax, cw, vert, o, cs){
  const g = el('g', Object.assign({ opacity:o, 'pointer-events':'none' },
    vert ? { transform:`rotate(90, ${mx}, ${my})` } : {}));
  const stroke = (d, sw) => el('path', { d, fill:'none', stroke:cssVar('--fg'),
    'stroke-width':sw, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, g);

  if (kind === 'res'){
    /* ギザギザ。JIS の箱記号は胴の四角そのものと見分けが付かないので折れ線で描く */
    const zx = ax*0.40, zy = cw*0.30, N = 6;
    let d = `M ${mx-zx} ${my}`;
    for (let i = 0; i < N; i++) d += ` L ${mx - zx + (i+0.5)*(2*zx/N)} ${my + (i%2?zy:-zy)}`;
    stroke(d + ` L ${mx+zx} ${my}`, 1.8);

  } else if (kind === 'cap'){
    /* 向かい合う2枚の極板と、そこへ入る引き出し線 */
    const gp = ax*0.11, py = cw*0.34;
    stroke(`M ${mx-gp} ${my-py} L ${mx-gp} ${my+py}`, 2.4);
    stroke(`M ${mx+gp} ${my-py} L ${mx+gp} ${my+py}`, 2.4);
    stroke(`M ${mx-ax*0.42} ${my} L ${mx-gp} ${my}`, 1.6);
    stroke(`M ${mx+gp} ${my} L ${mx+ax*0.42} ${my}`, 1.6);

  } else if (kind === 'diode'){
    /* 三角だけ。記号のバーの役は、胴の端に描いてある帯（カソードの実物の印）が務める */
    const tx = ax*0.24, ty = cw*0.30;
    el('path', { d:`M ${mx-cs*tx} ${my-ty} L ${mx-cs*tx} ${my+ty} L ${mx+cs*tx} ${my} Z`,
      fill:cssVar('--fg') }, g);
  }
}

function drawTr(p){
  const ks = Object.keys(p.pins);
  const hs = ks.map(k => ({ k, h:p.pins[k], ...pt(p.pins[k]) }));
  const o = activeNet && !ks.map(k=>p.nets[k]).includes(activeNet) ? .18 : 1;
  const cx = (Math.min(...hs.map(q=>q.x)) + Math.max(...hs.map(q=>q.x))) / 2;
  const cy = (Math.min(...hs.map(q=>q.y)) + Math.max(...hs.map(q=>q.y))) / 2;
  const flat = trFlat(p);
  /* 回転角。平らな面の法線が上(0,-1)なら0°、右なら90°… */
  let deg = 0;
  if (flat.dx === 1) deg = 90; else if (flat.dy === 1) deg = 180; else if (flat.dx === -1) deg = 270;
  if (mirrored) deg = -deg;                       /* 裏返すと左右が反転する */

  for (const q of hs)
    el('line', { x1:q.x, y1:q.y, x2:cx+(q.x-cx)*.6, y2:cy+(q.y-cy)*.6, stroke:cssVar('--fg'),
                 'stroke-width':1.4, opacity:o*.7, 'pointer-events':'none' });

  /* 胴は「平らな辺＋丸い背」を水平の姿で描いてから、まとめて回す */
  const g = el('g', { transform:`rotate(${deg}, ${cx}, ${cy})`, opacity:o });
  const bw = p.body.L*MM, dp = p.body.W*MM, top = cy - dp/2;
  const body = el('path', { d:`M ${cx-bw/2} ${top} L ${cx+bw/2} ${top} A ${bw/2} ${dp/2} 0 0 1 ${cx-bw/2} ${top} Z`,
    fill:cssVar('--fg'), 'fill-opacity':.82, cursor: mirrored?'default':'move' }, g);
  body.dataset.block = 'part:'+p.id;
  tip(body, `${p.name} TO-92 実寸 ${p.body.L} × ${p.body.W}mm。平らな面は${flat.name}`);
  /* 平らな辺を太線で強調（回転しても必ず正しい側に乗る） */
  el('line', { x1:cx-bw/2, y1:top, x2:cx+bw/2, y2:top, stroke:cssVar('--fg'),
               'stroke-width':3.5, 'pointer-events':'none' }, g);

  const nm = el('text', { x:cx, y:cy - dp/2 - 8 - (deg%180 ? 6 : 0), 'text-anchor':'middle',
    fill:cssVar('--fg'), 'font-size':11, 'font-weight':700, opacity:o, 'pointer-events':'none' });
  nm.textContent = `${p.name}（平らな面＝${flat.name}）`;
  for (const q of hs){
    const t = el('text', { x:q.x + flat.dx*15, y:q.y + flat.dy*15 + 4, 'text-anchor':'middle',
      fill:cssVar('--fg'), 'font-size':11, 'font-weight':700, opacity:o, 'pointer-events':'none' });
    t.textContent = q.k;
  }
}

function drawMarks(){
  if (muteWarn) return;
  const sev = {};
  for (const w of WARN){ if (!w.hole) continue; if (w.sev==='err' || !sev[w.hole]) sev[w.hole] = w.sev; }
  for (const h in sev){
    const q = pt(h), c = cssVar(sev[h]==='err' ? '--err' : '--amber');
    el('circle', { cx:q.x, cy:q.y, r:10, fill:'none', stroke:c, 'stroke-width':2.5,
      'stroke-dasharray': sev[h]==='err' ? 'none' : '4 3',
      opacity: activeNet?.35:.95, 'pointer-events':'none' });
    if (sev[h]==='err')
      el('circle', { cx:q.x, cy:q.y, r:14, fill:'none', stroke:c, 'stroke-width':1,
                     opacity: activeNet?.25:.6, 'pointer-events':'none' });
  }
}

/* 🔴 2026-08-18 追加（ユーザー要望）。青い下敷きだけでは、線が何本も交差する所で
   どれを選んでいるのか目で追えない。周りに霧をかけて、選んだ物だけを霧の上へ
   もう一度描き、点滅させる。実物と突き合わせながら押すための物。
   ⚠ 霧は pointer-events:none。当たり判定は霧の下にあるので、掴めなくならないこと。
   ⚠ ドラッグ中（drag）は出さない。動かしている最中に周りが消えたら位置を合わせられない。
   ⚠ 点の編集中（sel.vi）も出さない。ハンドルを見ながら摘まむ作業の邪魔になる。 */
function drawSpotlight(){
  if (!sel || drag || sel.vi !== null && sel.vi !== undefined) return;
  const W = PADX*2 + (NCOL-1)*PITCH, Hh = PADY*2 + (ROWS.length-1)*PITCH;
  el('rect', { x:-GUTTER, y:-20, width:W + GUTTER*2, height:Hh + 84,
    fill:cssVar('--bg'), opacity:.82, 'pointer-events':'none' });
  drawAxis();     /* 行と列の見出しは霧の上へ出し直す。沈むと穴の位置が読めない */
  const col = cssVar('--sel');
  const glow = (tag, attrs) => {
    const n = el(tag, Object.assign({ 'pointer-events':'none' }, attrs));
    n.setAttribute('class', 'glow');
    return n;
  };
  if (sel.kind === 'jumper' || sel.kind === 'bridge'){
    const o = selPath(); if (!o) return;
    const ps = o.path.map(pt), c = netColor(o.net);
    const pts = ps.map(p=>`${p.x},${p.y}`).join(' ');
    const dash = sel.kind === 'jumper' ? '7 4' : 'none';
    /* 太い下敷きは【点滅させない】。ここを光らせると、点滅の山で線を塗りつぶして
       ネットの色と破線（表の被覆線）が消える。太さは「どこにあるか」を出すだけ */
    el('polyline', { points:pts, fill:'none', stroke:col, 'stroke-width':12,
      'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.2,
      'pointer-events':'none' });
    el('polyline', { points:pts, fill:'none', stroke:c, 'stroke-width':3.5,
      'stroke-linecap':'round', 'stroke-linejoin':'round',
      'stroke-dasharray':dash, 'pointer-events':'none' });
    /* 点滅するのはこの1本。同じ破線で重ねてあるので、光っても
       「表の被覆線か、裏のブリッジか」の見分けは消えない */
    glow('polyline', { points:pts, fill:'none', stroke:col, 'stroke-width':4.5,
      'stroke-linecap':'round', 'stroke-linejoin':'round', 'stroke-dasharray':dash });
    /* 両端に穴の名前。実物を指で追うとき、端がどこかを目で確かめられるように */
    for (const [h, p] of [[o.path[0], ps[0]], [o.path[o.path.length-1], ps[ps.length-1]]]){
      el('circle', { cx:p.x, cy:p.y, r:7, fill:'none', stroke:col, 'stroke-width':2.5,
        'pointer-events':'none' });
      const t = el('text', { x:p.x, y:p.y-13, 'text-anchor':'middle', fill:cssVar('--fg'),
        'font-size':12, 'font-weight':700, 'pointer-events':'none' });
      t.textContent = h;
    }
  } else {
    const b = blockList().find(x => x.id === sel.id); if (!b) return;
    const ps = b.holes().map(pt);
    const x0=Math.min(...ps.map(p=>p.x))-13, x1=Math.max(...ps.map(p=>p.x))+13;
    const y0=Math.min(...ps.map(p=>p.y))-13, y1=Math.max(...ps.map(p=>p.y))+13;
    glow('rect', { x:x0, y:y0, width:x1-x0, height:y1-y0, rx:6, fill:col, 'fill-opacity':.22,
      stroke:col, 'stroke-width':3 });
    for (const p of ps)
      el('circle', { cx:p.x, cy:p.y, r:5.5, fill:col, 'pointer-events':'none' });
    const t = el('text', { x:(x0+x1)/2, y:y0-8, 'text-anchor':'middle', fill:cssVar('--fg'),
      'font-size':12, 'font-weight':700, 'pointer-events':'none' });
    t.textContent = b.name;
  }
}

function drawSelection(){
  if (!sel) return;
  const col = cssVar('--sel');
  if (sel.kind === 'jumper' || sel.kind === 'bridge'){
    const o = selPath(); if (!o) return;
    const ps = o.path.map(pt);
    el('polyline', { points: ps.map(p=>`${p.x},${p.y}`).join(' '), fill:'none', stroke:col,
      'stroke-width':6, 'stroke-linecap':'round', 'stroke-linejoin':'round',
      opacity:.32, 'pointer-events':'none' });
    if (sel.vi !== null && sel.vi !== undefined){
      const hs = selHandles();
      /* 区間の真ん中に「＋」を出す。掴んで引っぱると、そこに折れ点ができて曲がる */
      for (let i = 0; i < hs.length-1; i++){
        const a = hs[i], b = hs[i+1];
        if (Math.abs(C(a)-C(b)) + Math.abs(R(a)-R(b)) < 2) continue;
        const q = pt(H(Math.round((C(a)+C(b))/2), Math.round((R(a)+R(b))/2)));
        const add = el('circle', { cx:q.x, cy:q.y, r:8, fill:cssVar('--panel'),
          stroke:col, 'stroke-width':2, opacity:.95, cursor:'crosshair' });
        add.dataset.addvertex = i;
        const t = el('text', { x:q.x, y:q.y+4.5, 'text-anchor':'middle', fill:col,
          'font-size':13, 'font-weight':700, 'pointer-events':'none' });
        t.textContent = '+';
      }
      hs.map(pt).forEach((p,i) => {
        const g2 = el('rect', { x:p.x-7, y:p.y-7, width:14, height:14, rx:2,
          fill: i===sel.vi ? col : cssVar('--panel'), stroke:col, 'stroke-width':2,
          cursor:'move' });
        g2.dataset.vertex = i;
      });
    }
  } else {
    const b = blockList().find(x=>x.id===sel.id); if (!b) return;
    const ps = b.holes().map(pt);
    const x0=Math.min(...ps.map(p=>p.x))-13, x1=Math.max(...ps.map(p=>p.x))+13;
    const y0=Math.min(...ps.map(p=>p.y))-13, y1=Math.max(...ps.map(p=>p.y))+13;
    el('rect', { x:x0, y:y0, width:x1-x0, height:y1-y0, rx:6, fill:'none', stroke:col,
      'stroke-width':2.5, 'stroke-dasharray':'3 3', opacity:.9, 'pointer-events':'none' });
  }
}

/* ===========================================================
   編集
   =========================================================== */
function capture(ev){ try { svg.setPointerCapture(ev.pointerId); } catch(e){} }
function svgPoint(ev){
  const m = svg.getScreenCTM().inverse();
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m);
  return p;
}
function nearestHole(p){
  let c = Math.round((p.x - PADX)/PITCH) + 1;
  if (mirrored) c = NCOL + 1 - c;
  const r = Math.round((p.y - PADY)/PITCH);
  return { c: Math.max(1, Math.min(NCOL, c)), r: Math.max(0, Math.min(ROWS.length-1, r)) };
}

svg.addEventListener('pointerdown', ev => {
  /* 🔴 番号のクリック（data-pick）。選ぶだけで、ドラッグには入らない。
     ⚠ mirrored の門より【手前】に置く。実物と突き合わせるのは半田面を見ている
     ときなので、裏返した状態で光らせられないと使い物にならない。
     編集はしないので、裏返しでも安全 */
  const dp = (ev.target.dataset || {}).pick;
  if (dp !== undefined){
    const [kind, id] = dp.split(':');
    const same = sel && sel.kind === kind && sel.id === id;
    sel = same ? null : { kind, id, vi:null };   /* もう一度押したら消える */
    render();
    return;
  }
  if (mirrored) return;
  rotSession = null;          /* 図に触ったら回転の連続扱いを打ち切る */
  /* ⚠ ここで preventDefault() してはいけない。マウス互換イベントごと潰れて
     dblclick が発火しなくなる（2026-08-11・折れ点を追加できなくなった）。
     文字の選択は body.dragging の user-select と selectstart で止める */
  document.body.classList.add('dragging');
  const ds = ev.target.dataset || {};

  /* 「＋」を掴む＝その区間に折り目を入れて、そのまま引っぱる（両端は動かない） */
  if (ds.addvertex !== undefined && sel && (sel.kind==='jumper' || sel.kind==='bridge')){
    if (selPath()){
      pushUndo();
      const i = +ds.addvertex;
      drag = { mode:'jog', si:i };
      const j = insertJog(i);
      if (j){ drag.A = j.A; drag.B = j.B; drag.vertSeg = j.vertSeg; sel.vi = i+1; }
      capture(ev); render(); return;
    }
  }
  if (ds.vertex !== undefined && sel
      && (sel.kind==='jumper' || sel.kind==='bridge')){
    pushUndo();
    sel.vi = +ds.vertex;
    drag = { mode:'vertex' };
    if (sel.kind === 'bridge'){ const o = selPath(); if (o) drag.corners = cornersOf(o.path); }
    capture(ev); render(); return;
  }
  if (ds.jumper !== undefined || ds.bridge !== undefined){
    const kind = ds.jumper !== undefined ? 'jumper' : 'bridge';
    const id = kind === 'jumper' ? ds.jumper : +ds.bridge;
    const same = sel && sel.kind === kind && sel.id === id;
    /* 1回目のクリックで線ぜんぶ、選択済みをもう一度で点の編集へ */
    if (!same) sel = { kind, id, vi:null };
    else if (sel.vi === null || sel.vi === undefined) sel = { kind, id, vi:0 };
    pushUndo();
    drag = { mode:'path', grab: nearestHole(svgPoint(ev)), orig: selPath().path.slice() };
    capture(ev); render(); return;
  }
  if (ds.block !== undefined){
    sel = { kind:'block', id:ds.block };
    pushUndo();
    const b = blockList().find(x=>x.id===ds.block);
    /* ⚠ snap（ドラッグ開始時の全体）を持つ。これが無いと、動かすたびに
       「そのときの位置」から差分を当ててしまい、周りの線が置いていかれる
       （2026-08-11 ユーザー報告「バラバラになっちゃった」） */
    drag = { mode:'block', id:ds.block, grab: nearestHole(svgPoint(ev)),
             orig: b.holes().slice(), snap: clone(L) };
    capture(ev); render(); return;
  }
  /* 空き地。「線を引く」がONのときだけ新しい被覆線を引く。
     ⚠ 常時ONにしていたら、選択解除のつもりの操作で線が量産された（2026-08-11 ユーザー指摘） */
  sel = null;
  if (drawing){
    const g = nearestHole(svgPoint(ev));
    drag = { mode:'new', from:g, to:g };
    capture(ev);
  }
  render();
});

svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  const g = nearestHole(svgPoint(ev));
  if (drag.mode === 'new'){ drag.to = g; render(); return; }
  if (drag.mode === 'path'){
    const o = selPath(); if (!o) return;
    const dc = g.c - drag.grab.c, dr = g.r - drag.grab.r;
    const np = drag.orig.map(h => H(C(h)+dc, R(h)+dr));
    if (np.every(h => inBoard(C(h), R(h)))) o.path = np;
  } else if (drag.mode === 'block'){
    /* 毎回スナップショットへ戻してから、開始位置からの差分を1回だけ当てる */
    L = clone(drag.snap);
    const b = blockList().find(x=>x.id===drag.id);
    const dc = g.c - drag.grab.c, dr = g.r - drag.grab.r;
    const nh = drag.orig.map(h => H(C(h)+dc, R(h)+dr));
    if (nh.every(h => inBoard(C(h), R(h)))){
      const map = {}; drag.orig.forEach((h,i) => map[h] = nh[i]);
      b.set(nh);
      remapHoles(map, drag.orig);
    }
  } else if (drag.mode === 'jog'){
    moveJog(g.c, g.r);
  } else if (drag.mode === 'vertex'){
    moveVertex(g.c, g.r);
  }
  render();
});

function endDrag(){
  document.body.classList.remove('dragging');
  if (!drag) return;
  /* 動かし終えたら、重なった点と直線上の余分な点を掃除する */
  if ((drag.mode === 'jog' || drag.mode === 'vertex') && sel
      && (sel.kind === 'jumper' || sel.kind === 'bridge')){
    const o = selPath();
    if (o){
      const p = cleanPath(sel.kind === 'bridge' ? cornersOf(o.path) : o.path);
      o.path = sel.kind === 'bridge' ? expandPath(p) : p;
      const n = (sel.kind === 'bridge' ? cornersOf(o.path) : o.path).length;
      if (sel.vi != null) sel.vi = Math.max(0, Math.min(sel.vi, n-1));
    }
  }
  if (drag.mode === 'new'){
    const a = H(drag.from.c, drag.from.r), b = H(drag.to.c, drag.to.r);
    if (a !== b){
      pushUndo();
      const id = nextJumperId();
      const cs = (C(a)===C(b) || R(a)===R(b)) ? [a,b] : [a, H(C(b), R(a)), b];
      /* ⚠ 既定を実在のネット（GND等）にしない。決めていないものは決めていないと出す */
      const net = NET.holeNet[a] || NET.holeNet[b] || 'NONE';
      L.JUMPERS.push({ id, path:cs, net, what:'（新規）' });
      sel = { kind:'jumper', id, vi:null };
    }
  }
  drag = null; check(); save(); render();
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
/* 図の外で指を離したときの取りこぼし対策（掴んだ状態が残ると文字が選択され続ける） */
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
/* 掴んでいる間だけ、文字の選択と画像ドラッグを止める。
   pointerdown の preventDefault() でやると dblclick が死ぬので、こちらで止める */
document.addEventListener('selectstart', ev => { if (drag) ev.preventDefault(); });
svg.addEventListener('dragstart', ev => ev.preventDefault());

/* 部品を動かしたら、その足を指していたブリッジ・ジャンパ端も一緒に動かす。
   ブリッジは「隣り合うパッドの連鎖」でなければならないので、端が動いたら経路を張り直す */
function remapHoles(map, oldHoles){
  const old = new Set(oldHoles);
  for (const b of L.BRIDGES){
    if (!b.path.some(h => old.has(h))) continue;
    b.path = b.path.map(h => old.has(h) ? map[h] : h);
    b.path = rebuildChain(b.path[0], b.path[b.path.length-1]);
  }
  for (const j of L.JUMPERS){
    const n = j.path.length;
    let moved = false;
    if (old.has(j.path[0])){ j.path[0] = map[j.path[0]]; moved = true; }
    if (old.has(j.path[n-1])){ j.path[n-1] = map[j.path[n-1]]; moved = true; }
    /* 端が斜めにずれた分はL字で吸収する（直角しか許さないため） */
    if (moved) fixDiagonals(j.path);
  }
}

/* 2点を、隣り合う穴だけを通るL字の連鎖で結ぶ（列 → 行の順） */
function rebuildChain(a, b){
  const out = [a];
  let c = C(a), r = R(a);
  const dc = Math.sign(C(b)-c);
  while (c !== C(b)){ c += dc; out.push(H(c,r)); }
  const dr = Math.sign(R(b)-r);
  while (r !== R(b)){ r += dr; out.push(H(c,r)); }
  return out;
}

/* ブリッジは「隣り合う穴の連鎖」で持つが、掴んで動かすのは折れ点だけでよい。
   連鎖 ⇔ 折れ点 を往復する */
function dirOf(a,b){ return Math.sign(C(b)-C(a)) + ',' + Math.sign(R(b)-R(a)); }
function cornersOf(path){
  if (path.length <= 2) return path.slice();
  const out = [path[0]];
  for (let i = 1; i < path.length-1; i++)
    if (dirOf(path[i-1], path[i]) !== dirOf(path[i], path[i+1])) out.push(path[i]);
  out.push(path[path.length-1]);
  return out;
}
function expandPath(cs){
  let out = [cs[0]];
  for (let i = 0; i < cs.length-1; i++) out = out.concat(rebuildChain(cs[i], cs[i+1]).slice(1));
  return out;
}

const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚'.split('');
function nextJumperId(){
  const used = new Set(L.JUMPERS.map(j=>j.id));
  for (const ch of CIRCLED) if (!used.has(ch)) return ch;
  return 'J' + (L.JUMPERS.length + 1);
}
function selPath(){
  if (!sel) return null;
  if (sel.kind === 'jumper') return L.JUMPERS.find(x=>x.id===sel.id);
  if (sel.kind === 'bridge') return L.BRIDGES[sel.id];
  return null;
}
/* ── 部品の向き ──
   穴の並びから胴の向きを決める。longMM は足の並ぶ方向、shortMM はそれに直交する幅。
   これで回転しても胴の描き方と当たり判定が自動で追従する */
function orientedBox(holes, longMM, shortMM){
  const cs = holes.map(C), rs = holes.map(h => R(h) + 1);
  const c0 = Math.min(...cs), c1 = Math.max(...cs);
  const r0 = Math.min(...rs), r1 = Math.max(...rs);
  const horiz = (c1 - c0) >= (r1 - r0);
  const wC = (horiz ? longMM : shortMM) / 2.54;
  const hR = (horiz ? shortMM : longMM) / 2.54;
  const exC = (wC - (c1 - c0)) / 2, exR = (hR - (r1 - r0)) / 2;
  return { c0:c0-exC, c1:c1+exC, r0:r0-exR, r1:r1+exR, horiz };
}
/* 論理の箱 → 画面の矩形 */
function boxPx(b){
  const xa = xOf(b.c0), xb = xOf(b.c1);
  return { x: Math.min(xa,xb), y: PADY + (b.r0 - 1) * PITCH,
           w: Math.abs(xb - xa), h: (b.r1 - b.r0) * PITCH };
}

/* 90°ずつ回す。軸は最初の足。盤外へ出る回転はしない */
const EXIT_CW = { up:'right', right:'down', down:'left', left:'up' };
function rotateBlockHoles(holes){
  const pc = C(holes[0]), pr = R(holes[0]);
  return holes.map(h => {
    const dc = C(h) - pc, dr = R(h) - pr;      /* 画面座標(yは下向き)での時計回り */
    return H(pc - dr, pr + dc);
  });
}
/* ⚠ 回すたびにブリッジを引き直すので、素直に繰り返すと1周しても元に戻らない。
   同じ部品を続けて回している間は「最初の状態から n×90°」として計算し直す。
   こうすれば4回で必ず元通りになる（2026-08-11） */
let rotSession = null;

/* 部品を部品面 ⇔ 半田面に付け替える。
   🔴 2026-08-14 追加。ダイオードのように、置き場所しだいで表にも裏にもなる部品がある。
   これが画面から変えられなかったので、リレーのコイルから離れた場所へ移したあとも
   「（裏）」と描かれ続け、胴の隙間の検査からも外れ、組む順番の文も古いままだった。 */
function selectedPart(){
  if (!sel || sel.kind !== 'block' || !/^part:/.test(sel.id)) return null;
  return L.PARTS.find(p => 'part:' + p.id === sel.id) || null;
}
function flipPartSide(){
  const p = selectedPart();
  if (!p) return;
  pushUndo();
  if (p.under) delete p.under; else p.under = true;
}

function rotateSelectedBlock(){
  if (!sel || sel.kind !== 'block') return;
  if (!rotSession || rotSession.id !== sel.id)
    rotSession = { id: sel.id, snap: clone(L), turns: 0 };
  const before = clone(L);
  L = clone(rotSession.snap);
  const b = blockList().find(x => x.id === sel.id);
  if (!b){ L = before; return; }
  const orig = b.holes().slice();
  /* 盤外に出る向きは飛ばす。⚠ 飛ばさないと、行き止まりの向きで詰まって
     元の向きにも戻れなくなる（0回転＝元の状態は必ず成立するので、必ずどれかに当たる） */
  let turns = null, nh = null;
  for (let k = 1; k <= 4; k++){
    const tt = (rotSession.turns + k) % 4;
    let cand = orig;
    for (let i = 0; i < tt; i++) cand = rotateBlockHoles(cand);
    if (cand.every(h => inBoard(C(h), R(h)))){ turns = tt; nh = cand; break; }
  }
  if (turns === null){ L = before; return; }
  undoStack.push(before);
  if (undoStack.length > 60) undoStack.shift();
  const map = {}; orig.forEach((h,i) => map[h] = nh[i]);
  b.set(nh);
  if (b.ref && b.ref.exit){
    let e = b.ref.exit;
    for (let i = 0; i < turns; i++) e = EXIT_CW[e] || e;
    b.ref.exit = e;
  }
  remapHoles(map, orig);
  rotSession.turns = turns;
}

/* 2SC1815 の平らな面の向きは、B→E の並びから決まる
   （POWER.md: 平らな面を行A側へ向けると、基板の上で左から B–C–E） */
function trFlat(p){
  const b = p.pins.B, e = p.pins.E;
  const dc = Math.sign(C(e) - C(b)), dr = Math.sign(R(e) - R(b));
  if (dc ===  1) return { dx:0,  dy:-1, name:'行A側（上）' };
  if (dr ===  1) return { dx:1,  dy:0,  name:'列25側（右）' };
  if (dc === -1) return { dx:0,  dy:1,  name:'行O側（下）' };
  return                { dx:-1, dy:0,  name:'列1側（左）' };
}

/* 選択中の線の、掴める点（ジャンパは全点・ブリッジは折れ点だけ） */
function selHandles(){
  const o = selPath(); if (!o) return [];
  return sel.kind === 'bridge' ? cornersOf(o.path) : o.path;
}

/* 編集中の点の配列。ブリッジは折れ点で編集するが、真っ直ぐな途中に足した点は
   cornersOf() だと消えてしまうので、掴んでいる間だけ drag 側で保持する */
function workingPoints(){
  const o = selPath(); if (!o) return null;
  if (sel.kind !== 'bridge') return o.path;
  return (drag && drag.corners) ? drag.corners : cornersOf(o.path);
}
function commitPoints(p){
  const o = selPath(); if (!o) return;
  o.path = sel.kind === 'bridge' ? expandPath(p) : p;
}

/* 重なった点と、直線上に乗っているだけの点を落とす */
function cleanPath(p){
  const out = [];
  for (const h of p) if (!out.length || out[out.length-1] !== h) out.push(h);
  for (let i = 1; i < out.length-1; ){
    if (dirOf(out[i-1], out[i]) === dirOf(out[i], out[i+1])) out.splice(i, 1);
    else i++;
  }
  return out;
}

/* 選択中の点を1つ動かす。直角を保つため隣の点を追従させるが、
   🔴 両端は穴に挿さっているので動かさない。端が斜めになる場合は間に点を足して吸収する */
function moveVertex(c, r){
  const o = selPath(); if (!o) return;
  let i = sel.vi;
  const p = workingPoints();
  const oldH = p[i];
  if (!oldH) return;
  p[i] = H(c, r);

  /* 後ろ側を先に。前側で splice すると添字がずれるため */
  if (i < p.length-1){
    const next = p[i+1], wasVert = C(next) === C(oldH);
    if (i+1 === p.length-1){
      if (C(next) !== c && R(next) !== r)
        p.splice(i+1, 0, wasVert ? H(C(next), r) : H(c, R(next)));
    } else {
      p[i+1] = wasVert ? H(c, R(next)) : H(C(next), r);
    }
  }
  if (i > 0){
    const prev = p[i-1], wasVert = C(prev) === C(oldH);
    if (i-1 === 0){
      if (C(prev) !== c && R(prev) !== r){
        p.splice(i, 0, wasVert ? H(C(prev), r) : H(c, R(prev)));
        i++; sel.vi = i;
      }
    } else {
      p[i-1] = wasVert ? H(c, R(prev)) : H(C(prev), r);
    }
  }
  commitPoints(p);
}

/* 区間に「折り目」を入れる。両端を動かさずに曲げるには点が2つ要るので、
   区間の両端のコピーを挿し込んで、その2点を平行に動かす */
function insertJog(i, offset){
  const o = selPath(); if (!o) return null;
  const p = sel.kind === 'bridge' ? cornersOf(o.path) : o.path;
  const A = p[i], B = p[i+1];
  const vertSeg = C(A) === C(B);
  let A2 = A, B2 = B;
  if (offset){                       /* 見えるように1穴ずらす（ダブルクリック用） */
    if (vertSeg){
      const nc = Math.max(1, Math.min(NCOL, C(A) + offset));
      A2 = H(nc, R(A)); B2 = H(nc, R(B));
    } else {
      const nr = Math.max(0, Math.min(ROWS.length-1, R(A) + offset));
      A2 = H(C(A), nr); B2 = H(C(B), nr);
    }
  }
  p.splice(i+1, 0, A2, B2);
  if (sel.kind === 'bridge' && drag) drag.corners = p;
  commitPoints(p);
  return { A, B, vertSeg, points:p };
}
function moveJog(c, r){
  const p = workingPoints(), i = drag.si;
  if (drag.vertSeg){
    p[i+1] = H(c, R(drag.A));
    p[i+2] = H(c, R(drag.B));
  } else {
    p[i+1] = H(C(drag.A), r);
    p[i+2] = H(C(drag.B), r);
  }
  commitPoints(p);
}

/* ダブルクリックで折れ点を追加 */
svg.addEventListener('dblclick', ev => {
  if (mirrored) return;
  ev.preventDefault();
  const ds = ev.target.dataset || {};
  if (ds.jumper === undefined && ds.bridge === undefined) return;
  const kind = ds.jumper !== undefined ? 'jumper' : 'bridge';
  const id = kind === 'jumper' ? ds.jumper : +ds.bridge;
  sel = { kind, id, vi:null };
  const o = selPath(); if (!o) return;
  const g = nearestHole(svgPoint(ev));
  const p = kind === 'bridge' ? cornersOf(o.path) : o.path;
  /* いちばん近い区間に割り込ませる */
  let best = 0, bd = Infinity;
  const q = pt(H(g.c, g.r));
  for (let i = 0; i < p.length-1; i++){
    const a = pt(p[i]), b = pt(p[i+1]);
    const d = (q.x-(a.x+b.x)/2)**2 + (q.y-(a.y+b.y)/2)**2;
    if (d < bd){ bd = d; best = i; }
  }
  pushUndo();
  sel.vi = best+1;
  insertJog(best, 1);       /* 1点ではなく折り目（2点）を入れる。1点だと端まで動いてしまう */
  check(); save(); render();
});

/* 斜めになった区間をL字に直す */
function fixDiagonals(p){
  for (let i = 0; i < p.length-1; i++){
    const a = p[i], b = p[i+1];
    if (C(a) !== C(b) && R(a) !== R(b)){ p.splice(i+1, 0, H(C(b), R(a))); i++; }
  }
  return p;
}

window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ sel = null; render(); return; }
  /* 🔴 半田面では番号クリックで選べるようになった（2026-08-18）。選択があると
     R と Delete が通ってしまうので、その2つだけ打ち切る。
     ⚠「裏返している間は編集できない」を崩さないこと。
     ⚠ Ctrl+Z は元から裏でも効いていたので、ここでは止めない */
  if (mirrored && (ev.key === 'Delete' || ev.key === 'Backspace'
                   || ev.key === 'r' || ev.key === 'R')) return;
  if ((ev.key === 'r' || ev.key === 'R') && !ev.ctrlKey && !ev.metaKey
      && sel && sel.kind === 'block'){
    ev.preventDefault(); rotateSelectedBlock(); check(); save(); render(); return;
  }
  if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase() === 'z'){
    ev.preventDefault();
    if (undoStack.length){ L = undoStack.pop(); sel = null; check(); save(); render(); }
    return;
  }
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && sel
      && (sel.kind==='jumper' || sel.kind==='bridge')){
    const o = selPath(); if (!o) return;
    /* 点を選んでいれば点を消す。線ぜんぶを選んでいれば線を消す */
    if (sel.vi !== null && sel.vi !== undefined){
      const p = sel.kind === 'bridge' ? cornersOf(o.path) : o.path;
      if (p.length <= 2) return;
      ev.preventDefault();
      pushUndo();
      p.splice(sel.vi, 1);
      fixDiagonals(p);
      o.path = sel.kind === 'bridge' ? expandPath(p) : p;
      sel.vi = Math.max(0, Math.min(sel.vi, (sel.kind==='bridge'?cornersOf(o.path):o.path).length-1));
    } else {
      ev.preventDefault();
      deleteSelection();
    }
    check(); save(); render();
  }
});

function deleteSelection(){
  if (!sel) return;
  pushUndo();
  if (sel.kind === 'jumper') L.JUMPERS = L.JUMPERS.filter(j => j.id !== sel.id);
  else if (sel.kind === 'bridge') L.BRIDGES.splice(sel.id, 1);
  else return;
  sel = null;
}

/* 表の被覆線 ⇔ 裏のブリッジ を入れ替える。
   短すぎる被覆線を直す手段がだいたいこれなので、1クリックでやれるようにしてある */
function convertSelection(){
  const o = selPath(); if (!o) return;
  pushUndo();
  if (sel.kind === 'jumper'){
    L.JUMPERS = L.JUMPERS.filter(j => j.id !== sel.id);
    L.BRIDGES.push({ path: expandPath(fixDiagonals(o.path.slice())), net:o.net });
    sel = { kind:'bridge', id:L.BRIDGES.length-1, vi:null };
  } else {
    L.BRIDGES.splice(sel.id, 1);
    const id = nextJumperId();
    L.JUMPERS.push({ id, path: cornersOf(o.path), net:o.net, what:'（裏から表へ）' });
    sel = { kind:'jumper', id, vi:null };
  }
}

/* ===========================================================
   パネル
   =========================================================== */
function drawNets(){
  const box = document.getElementById('nets');
  box.innerHTML = '';
  for (const key in NETS){
    const n = NETS[key], c = cssVar(n.css);
    const b = document.createElement('button');
    b.className = 'chip' + (activeNet===key ? ' on' : '');
    b.style.color = c;
    b.innerHTML = `<span class="dot" style="background:${c}"></span>${n.label}`;
    b.onclick = () => { activeNet = activeNet===key ? null : key; render(); };
    box.appendChild(b);
  }
}

/* 🔴 2026-08-18（ユーザー「①どこだーー？？？」）。
   番号を盤の外に並べる。図の中の番号を探させないための物なので、
   ⚠ 並びは必ず通し番号順。図に置いた順（＝引いた順）で出してはいけない。
   ⚠ 欠番（⑳・㉒）はマス目を空けたまま出す。詰めると、番号が飛んでいること自体が
      画面から消えて「自分が1本見落としたのか？」を毎回ここで悩むことになる。
   ⚠ 半田面でも押せる。押しても選ぶだけで、線は動かない。 */
function drawNums(){
  const box = document.getElementById('nums');
  box.innerHTML = '';
  const byId = {};
  for (const j of L.JUMPERS) byId[j.id] = j;
  const last = Math.max(...L.JUMPERS.map(j => CIRCLED.indexOf(j.id)));
  for (let i = 0; i <= last; i++){
    const id = CIRCLED[i], j = byId[id];
    if (!j){                       /* 欠番。押せない灰色の枠で場所だけ残す */
      const s = document.createElement('span');
      s.className = 'gap'; s.textContent = id;
      s.title = `${id} は欠番（この番号の線は無い）`;
      box.appendChild(s);
      continue;
    }
    const b = document.createElement('button');
    b.className = sel && sel.kind === 'jumper' && sel.id === id ? 'on' : '';
    b.textContent = id;
    b.style.color = netColor(j.net);
    b.title = `${NETS[j.net] ? NETS[j.net].label : j.net}　`
            + `${j.path[0]} → ${j.path[j.path.length-1]}${j.what ? '　— ' + j.what : ''}`;
    b.onclick = () => {
      const same = sel && sel.kind === 'jumper' && sel.id === id;
      sel = same ? null : { kind:'jumper', id, vi:null };
      render();
    };
    box.appendChild(b);
  }
}

function drawWarns(){
  const errs = WARN.filter(w=>w.sev==='err'), warns = WARN.filter(w=>w.sev==='warn');
  const ul = document.getElementById('warns');
  ul.innerHTML = '';
  if (muteWarn){
    const li = document.createElement('li');
    li.textContent = '警告を隠しています。上の「警告を出す」で戻ります。';
    ul.appendChild(li);
  } else if (!WARN.length){
    const li = document.createElement('li');
    li.className = 'ok';
    li.textContent = '破綻なし（1穴1本・短絡・+5VとGNDの隣接・断線・被覆線の長さ・交差と重なり・'
      + '剥き線の近接・胴の衝突と隙間・折り返し余裕・板からのはみ出しを検査）';
    ul.appendChild(li);
  } else {
    for (const w of [...errs, ...warns]){
      const li = document.createElement('li');
      li.className = w.sev + (w.jid ? ' clickable' : '');
