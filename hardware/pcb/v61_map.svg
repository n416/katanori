h="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="26.0" y="32" font-size="19" font-weight="bold" fill="#1b2430" font-family="Yu Gothic UI,Meiryo,sans-serif">v6.1 の板 — 載る物と、線が出る口 5 つ（82.024 × 37.4 × 1.6）</text><text x="26.0" y="56" font-size="12.5" fill="#44506a" font-family="Yu Gothic UI,Meiryo,sans-serif">緑 ＝ 線の口（JST-PH 2.0・枠 6.9 × 8.6）。薄い枠はプラグの相手が入る 3.1。破線の矢印は線の行き先（筐体からの実測）。</text><text x="26.0" y="75" font-size="12.5" fill="#44506a" font-family="Yu Gothic UI,Meiryo,sans-serif">リード＋トグル（4 ピン）は縦（上向き）。電池は板の裏に縦（下向き）。どちらも板の面を食わないので通り道の枠は無い。</text><text x="26.0" y="94" font-size="12.5" fill="#8a1c1c" font-family="Yu Gothic UI,Meiryo,sans-serif">⚠ リレーを前へ 2.0 動かした（筐体が示した限界は 2.5・つまみの軸まで 0.5 残る）。リードの口はその後ろに 0.3 で並ぶ。</text><text x="26.0" y="113" font-size="12.5" fill="#8a1c1c" font-family="Yu Gothic UI,Meiryo,sans-serif">⚠ 板を 4.0 上げた（🔒 ユーザー 2026-09-14）。裏 Z 12.0・表 13.6。裏の口はトップ型の嵌合 8.0 が 4.0 余して入る。板の座標は 1 つも動かない。</text><text x="26.0" y="521" font-size="12.5" fill="#1b2430" font-family="Yu Gothic UI,Meiryo,sans-serif">配線まで通っている（2026-09-16 夕に J10 を縦へ移して引き直し）: 53 部品・ネット 49 本・配線 742 本・ビア 64 ＋ GND を縫う 103。DRC のエラー 0・未接続 0。</text><text x="26.0" y="542" font-size="12.5" fill="#1b2430" font-family="Yu Gothic UI,Meiryo,sans-serif">高さ: 表の縦の口の上は 33 まで空く（筐体の実測）。裏は床まで 12.0 だが、電池の真上は 6.0 しか無いので、裏の口は左右の帯にしか置けない。</text><text x="26.0" y="563" font-size="12.5" fill="#1b2430" font-family="Yu Gothic UI,Meiryo,sans-serif">重なり: 区画・口・プラグの通り道 × 動かせない物 を機械で数えて 0 件。</text></svg>