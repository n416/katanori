  <line x1="40" y1="352" x2="660" y2="352" stroke="#dee2e6" stroke-width="1"/>
  <text x="40" y="372" font-size="11" fill="#343a40">ねじの半径 7.9 は上下から挟まれて1点に決まっている。内側はザグリ φ5.4 が軸受けの穴 3.675 に当たる限界（6.78）、外側は島の外径 11.0 に当たる限界（7.9・肉 0.4）、</text>
  <text x="40" y="389" font-size="11" fill="#343a40">そして天板の裏へ 3.0mm 出るねじ先がEリング（r6.35）を避ける下限（7.9・すき間 0.3）。ツメと壁のすき間は 1.4mm を確保（荒れる面なので削らない）。</text>
  <text x="40" y="406" font-size="10" fill="#868e96">⚠ Eリング外径 12.7 と ねじ頭 φ5.0 は📄（未実測）。どちらかが大きいと半径 7.9 は消える。実物を測ってから刷ること。</text>
