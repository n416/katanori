; ============================================================================
;  カタノリロボ 実機ファームウェア (XIAO ESP32S3)
;  Stage 1: OLEDに顔を表示するところまで
;
;  firmware/core と firmware/hal はシミュレーターと共有する。コピーを作らず
;  build_src_filter で直接コンパイル対象に加えている。
; ============================================================================
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ESP32-S3 のネイティブUSB(USB-Serial-JTAG)は DTR/RTS の変化をリセットとして
; 解釈する。モニタの開閉のたびに再起動がかかり、そのたびに ROM ブートログが
; GPIO43(=U0TXD=I2S DOUT)へ流れてスピーカーから轟音が出る。
; モニタ側でこれらの線を触らないようにして、開閉での再起動を止める。
monitor_dtr = 0
monitor_rts = 0

; src/ に加えて firmware/core/*.cpp をビルドする
; (パスは src_dir = firmware/esp32/src からの相対)
build_src_filter =
    +<*>
    +<../../core/*.cpp>

build_flags =
    ; ${PROJECT_DIR} は platformio.ini では未定義（空に展開されてパスが壊れる）。
    ; src_dir 起点で辿ること。
    -I${platformio.src_dir}/../../core
    -I${platformio.src_dir}/../../hal
    ; XIAO ESP32S3 の 8MB PSRAM を有効化 (Stage 3 の音声バッファで必須)
    -DBOARD_HAS_PSRAM
    ; ネイティブUSBをシリアルモニタとして使う
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; つまみの可動範囲。✅ 2026-09-02 実機で測った値（ゼロ点 RAW=883・最大 RAW=342
    ; ＝ 相対 3555 刻み ＝ 312.4度）に合わせた。既定の 270 のままだと上端の 42度が
    ; 全部 100% に潰れ、折返し判定（超過 45度 で 0% に倒れる）まで 2.5度 しか残らない。
    -DKATANORI_KNOB_SPAN_DEG=310
    ; 回す向き。0 は 9/02 の動作チェックで通った向き（883→342 と増える向き）。
    ; 🔒 2026-09-11 昼 ユーザー「つまみが逆になってます。最大音量でoffになっちゃってます」で 0 に戻した。
    ;    同日 02:43 に「天板の刷り直しで向きが反転した」として 1 にしていたが、ユーザー
    ;    「昨晩は私がおかしくしたのかも」。
    ;    0 に戻しただけでは「つまみ0で13%・最大でOFF」だった（同日 12:39 ユーザー）。同日 02:35 の
    ;    `knobzero`（RAW=989）が最大側の端で取られていたため。同日 12:52 に0側の端で
    ;    Wi-Fi モニタから `knobzero` を打ち直した（NVS RAW=1548。0側の端は 12:51 の実測で RAW=1548）。
    -DKATANORI_KNOB_DIR_INVERT=0

; XIAO ESP32S3 の PSRAM は OPI 接続。qio_opi を指定しないと PSRAM が
; 認識されない (Stage 3 で確実に踏む地雷なので最初から入れておく)
board_build.arduino.memory_type = qio_opi

lib_deps =
    olikraus/U8g2@^2.35.30
    links2004/WebSockets@^2.6.1
    ricmoo/QRCode@^0.0.1

; ----------------------------------------------------------------------------
; 診断: I2Cに一切触らないビルド。mic 0フレーム問題の切り分け専用
; （XMOSとの2マスター衝突疑い。詳細は main.cpp の KATANORI_I2C_SILENCE）
; ----------------------------------------------------------------------------
[env:xiao_esp32s3_i2csilence]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DKATANORI_I2C_SILENCE=1

; 診断: 途中で止める最小起動（I2C沈黙も含む）。MIN_BOOTの数字がカットライン
;   1 = audioIo.begin() 直後で打ち切り → ★読めた(2026-08-05)
;   2 = netLink.begin() の後で打ち切り
[env:xiao_esp32s3_minboot]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DKATANORI_I2C_SILENCE=1
    -DKATANORI_MIN_BOOT=6

; ----------------------------------------------------------------------------
;  48kHz の XMOS ファーム用（respeaker_lite_i2s_dfu_firmware_48k_v1.1.0_ch0-asr_ch1-mww）
;
;  🔴 ch0 の取り出し口から AGC を外すために移る。理由と手順は README の
;  「再生中の残留」を参照（v1.0.8 には取り出し口を選ぶ I2C コマンドが無い）。
;
;  機体の中と Gemini へ送るのは 16kHz のまま。48k↔16k の変換は AudioIo が内側で
;  やるので、main.cpp / NetLink / WakeWatch / DO 側は無改造でよい。
;
;  ⚠ XMOS のファームと合っていないと、音が 3倍速や 3分の1 の速さになる。
;  ファームを戻したら env も戻すこと（通常は xiao_esp32s3）。
; ----------------------------------------------------------------------------
[env:xiao_esp32s3_48k]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DKATANORI_XMOS_RATE=48000
    ; 🔴 AGC を外したぶんの感度を取り戻す（AudioIo.h の KATANORI_MIC_GAIN）。
    ; 2026-09-21 実測: 普通の声が RMS 36〜113 までしか入らず、大きな声を出さないと
    ; ゲート 300 を越えなかった。16倍で 576〜1808 になる（飽和は 32768）。
    ; ⚠ AGC と違って倍率が一定なので、残留エコーと声の比は変わらない。
    -DKATANORI_MIC_GAIN=16

; ----------------------------------------------------------------------------
;  呼び名の聞き分け（microWakeWord）を Arduino で動かす試験。本体のファームとは別に組む。
;    pio run -e mww_test -t upload
;
;  lib/ の tflite-micro・esp-nn・esp-micro-speech-features は ESPHome が使う版の写し
;  （esp-tflite-micro 1.3.3・esp-nn 1.1.2・esp-micro-speech-features 1.2.3）。
;  本体の env は #include しないので組み込まれない。
; ----------------------------------------------------------------------------
[env:mww_test]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.arduino.memory_type = qio_opi
build_src_filter =
    -<*>
    +<../mww_test/*.cpp>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I${platformio.src_dir}/../mww_test
    -DTF_LITE_STATIC_MEMORY
    ; esp-nn の S3 用の速い計算を選ぶ。ESP-IDF では Kconfig が決めるが、Arduino の
    ; sdkconfig には無いので、指定しないと汎用の遅い計算で組まれる
    -DCONFIG_NN_OPTIMIZED=1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    esp-micro-speech-features
    tflite-micro
    esp-nn

; マイクの ch0（会話用・取り出し口 3・16 倍）と ch1（XMOS の mww 向け）を同時に聞き分けにかける
[env:mww_live]
extends = env:mww_test
build_flags =
    ${env:mww_test.build_flags}
    -DMWW_LIVE

; ----------------------------------------------------------------------------
; Wi-Fi経由(OTA)で書き込むとき:  pio run -e xiao_esp32s3_ota -t upload
;
; 初回だけはUSBで通常envを焼くこと (OTA待受コードが乗っていない機体は受けられない)。
; katanori.local が引けない環境では upload_port を機体のIPに置き換える
; (IPはシリアルの `ota` か `n` で表示される)。--auth は main.cpp の
; KATANORI_OTA_PASSWORD と揃えること。
; ----------------------------------------------------------------------------
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = katanori.local
upload_flags = --auth=katanori
