; ============================================================================
;  カタノリロボ 実機ファームウェア (XIAO ESP32S3)
;  Stage 1: OLEDに顔を表示するところまで
;
;  firmware/core と firmware/hal はシミュレーターと共有する。コピーを作らず
;  build_src_filter で直接コンパイル対象に加えている。
; ============================================================================
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ESP32-S3 のネイティブUSB(USB-Serial-JTAG)は DTR/RTS の変化をリセットとして
; 解釈する。モニタの開閉のたびに再起動がかかり、そのたびに ROM ブートログが
; GPIO43(=U0TXD=I2S DOUT)へ流れてスピーカーから轟音が出る。
; モニタ側でこれらの線を触らないようにして、開閉での再起動を止める。
monitor_dtr = 0
monitor_rts = 0

; src/ に加えて firmware/core/*.cpp をビルドする
; (パスは src_dir = firmware/esp32/src からの相対)
build_src_filter =
    +<*>
    +<../../core/*.cpp>

build_flags =
    ; ${PROJECT_DIR} は platformio.ini では未定義（空に展開されてパスが壊れる）。
    ; src_dir 起点で辿ること。
    -I${platformio.src_dir}/../../core
    -I${platformio.src_dir}/../../hal
    ; XIAO ESP32S3 の 8MB PSRAM を有効化 (Stage 3 の音声バッファで必須)
    -DBOARD_HAS_PSRAM
    ; ネイティブUSBをシリアルモニタとして使う
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; XIAO ESP32S3 の PSRAM は OPI 接続。qio_opi を指定しないと PSRAM が
; 認識されない (Stage 3 で確実に踏む地雷なので最初から入れておく)
board_build.arduino.memory_type = qio_opi

lib_deps =
    olikraus/U8g2@^2.35.30
    links2004/WebSockets@^2.6.1
    ricmoo/QRCode@^0.0.1

; ----------------------------------------------------------------------------
; 診断: I2Cに一切触らないビルド。mic 0フレーム問題の切り分け専用
; （XMOSとの2マスター衝突疑い。詳細は main.cpp の KATANORI_I2C_SILENCE）
; ----------------------------------------------------------------------------
[env:xiao_esp32s3_i2csilence]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DKATANORI_I2C_SILENCE=1

; 診断: 途中で止める最小起動（I2C沈黙も含む）。MIN_BOOTの数字がカットライン
;   1 = audioIo.begin() 直後で打ち切り → ★読めた(2026-08-05)
;   2 = netLink.begin() の後で打ち切り
[env:xiao_esp32s3_minboot]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DKATANORI_I2C_SILENCE=1
    -DKATANORI_MIN_BOOT=6

; ----------------------------------------------------------------------------
; Wi-Fi経由(OTA)で書き込むとき:  pio run -e xiao_esp32s3_ota -t upload
;
; 初回だけはUSBで通常envを焼くこと (OTA待受コードが乗っていない機体は受けられない)。
; katanori.local が引けない環境では upload_port を機体のIPに置き換える
; (IPはシリアルの `ota` か `n` で表示される)。--auth は main.cpp の
; KATANORI_OTA_PASSWORD と揃えること。
; ----------------------------------------------------------------------------
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = katanori.local
upload_flags = --auth=katanori
