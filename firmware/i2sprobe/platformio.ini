; ============================================================================
;  I2S探り針 — ReSpeaker Lite のクロック線が生きているかだけを見る最小ファーム
;
;  本体ファーム(firmware/esp32)とは完全に独立。Wi-Fi/OLED/つまみ/I2C を一切
;  持たないので、「本体ファームのどこかが悪さをしている」可能性を変数から外せる。
;
;  使い方:  pio run -t upload   (このディレクトリで)
; ============================================================================
[env:probe]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
; ネイティブUSBをシリアルにする。モニタ開閉での再起動を止める
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
; 切り分け用: 本体と同じPSRAM設定(OPI)を足しただけの探り針。
; 本体だけ mic 0フレームになる問題の犯人捜し（I2C説は2026-08-05に棄却済み）。
; これで0フレームになればPSRAM設定が犯人。
; ----------------------------------------------------------------------------
[env:probe_psram]
extends = env:probe
build_flags =
    ${env:probe.build_flags}
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi

; PSRAM(白と判明済み)の上にWi-Fiを足す。これで0フレームならWi-Fiが犯人
[env:probe_wifi]
extends = env:probe_psram
build_flags =
    ${env:probe_psram.build_flags}
    -DPROBE_WIFI=1
