; ============================================================================
;  空スケッチ — 発熱の切り分け専用
;
;  USB CDC のフラグだけ探り針と揃えてある。これが無いと次に焼けなくなる。
; ============================================================================
[env:blank]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
